<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="color-scheme" content="light dark">
<title>Busy Nest — Free Demo</title>
<style>
:root{
  --sans: ui-rounded,"SF Pro Rounded","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,"Noto Sans Thai",sans-serif;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --bg:#F4F3EE;--card:#FFFFFF;--soft:#ECEFE8;--line:#E2E5DD;--ink:#1F2A26;--muted:#5E6A63;--accent:#4F7C67;--accent-2:#E58A6B;--gold:#E1B04B;--good:#3E8A62;--bad:#C4553F;
  --on-accent:#FFFFFF;--on-accent-2:#1F2A26;--focus-bg:#1F2A26;--focus-ink:#F4F3EE;--accent-ink:#4F7C67;--accent2-ink:#B4553A;--good-ink:#3E8A62;--gold-ink:#8A6A1F;
  --shadow:0 1px 2px rgba(31,42,38,.04),0 12px 32px rgba(31,42,38,.06);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:500;letter-spacing:-.015em;margin:0}
h1{font-size:40px;line-height:1.1}
h2{font-size:22px;line-height:1.2}
h3{font-size:18px}
p{margin:0 0 .6em}
a{color:var(--accent-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:var(--muted);margin-bottom:6px}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:200;background:var(--card);padding:8px 14px;border-radius:999px}
.skip:focus{left:8px}

/* layout */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 14px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line);background:var(--bg)}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand b{font-family:var(--serif);font-weight:500;font-size:21px;display:block;line-height:1.1}
.brand span{font-size:11.5px;line-height:1.3;color:var(--muted);font-style:italic;font-family:var(--serif);display:block}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
.nav a:hover{background:var(--soft)}
.nav a[aria-current=page]{background:var(--card);box-shadow:var(--shadow);color:var(--accent-ink)}
.nav svg,.ico{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
.main{min-width:0;padding:0 40px 90px;max-width:1220px;width:100%;justify-self:center}
.topbar{display:flex;align-items:center;gap:10px;padding:18px 0 10px;flex-wrap:wrap}
.topbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;flex:none}
.chip.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card));border-color:var(--bad);color:var(--ink)}
.chip.bad .dot{background:var(--bad)}
.view{min-width:0}
.view section{margin-bottom:22px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:14px 0 22px}
.head .lead{color:var(--muted);margin-top:6px;max-width:640px}
.foot{color:var(--muted);font-size:12.5px;margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}

/* cards & grids */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);min-width:0;position:relative}
.card-t{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card-t h2,.card-t h3{font-size:20px}
.card-t .sp{flex:1}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px}
.kpi .k{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--muted)}
.kpi .v{font-family:var(--serif);font-size:30px;line-height:1.15;margin:6px 0 2px;overflow-wrap:anywhere}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.good .v{color:var(--good-ink)} .kpi.gold .v{color:var(--gold-ink)} .kpi.warm .v{color:var(--accent2-ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;font-weight:700;font-size:14px;padding:10px 18px;border:1px solid transparent;cursor:pointer;background:var(--soft);color:var(--ink);min-height:40px;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px;min-height:32px}
.btn.link{background:none;padding:0;min-height:0;border:0;text-decoration:underline;color:var(--accent-ink);font-weight:600}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.help{width:21px;height:21px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--muted);font-size:12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.tag.good{background:color-mix(in srgb,var(--good) 16%,var(--card));color:var(--ink)}
.tag.bad{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--ink)}
.tag.warm{background:color-mix(in srgb,var(--accent-2) 20%,var(--card));color:var(--ink)}
.tag.gold{background:color-mix(in srgb,var(--gold) 25%,var(--card));color:var(--ink)}
.banner{border-radius:18px;padding:14px 18px;margin:8px 0 16px;background:color-mix(in srgb,var(--gold) 18%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card));border-color:var(--bad)}
.banner.info{background:color-mix(in srgb,var(--accent) 10%,var(--card));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.banner p{margin:0;flex:1;min-width:220px}

/* hero */
.hero{overflow:hidden;background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%),radial-gradient(70% 60% at 100% 0%,color-mix(in srgb,var(--accent-2) 12%,transparent),transparent 70%),var(--card)}
.big{font-family:var(--serif);font-size:clamp(66px,9vw,112px);line-height:1;letter-spacing:-.03em;margin:8px 0 6px;display:flex;align-items:baseline;flex-wrap:wrap}
.big .sym{font-size:.4em;margin:0 .08em;color:var(--muted)}
.big .frac{font-size:.42em;color:var(--accent-ink)}
.hero .sub{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--muted);margin-bottom:14px}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.over>i{background:var(--accent-2)}
.bar.gold>i{background:var(--gold)} .bar.good>i{background:var(--good)} .bar.warm>i{background:var(--accent-2)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.qbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:40px}
.qbtn:hover{background:var(--soft)}
.divider{border-top:1.5px dashed var(--line);margin:14px 0}

/* focus card */
.focus{background:var(--focus-bg);color:var(--focus-ink);border-radius:24px;padding:22px;display:flex;gap:16px;align-items:flex-start;margin-bottom:18px;box-shadow:var(--shadow)}
.focus .em{width:46px;height:46px;border-radius:50%;background:color-mix(in srgb,var(--focus-ink) 14%,transparent);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.focus .eyebrow{color:color-mix(in srgb,var(--focus-ink) 70%,transparent)}
.focus .txt{font-family:var(--serif);font-size:25px;line-height:1.2}
.focus .sub{opacity:.82;margin:6px 0 12px}
.focus .btn.ghost{color:var(--focus-ink);border-color:color-mix(in srgb,var(--focus-ink) 35%,transparent)}
.focus .btn.soft{background:color-mix(in srgb,var(--focus-ink) 14%,transparent);color:var(--focus-ink)}

/* lists */
.list{list-style:none;margin:0;padding:0}
.li{display:flex;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line);border-radius:12px;min-width:0}
.li:last-child{border-bottom:0}
.li[data-act]{cursor:pointer}
.li[data-act]:hover{background:var(--soft)}
.tile{width:38px;height:38px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.li .mid{flex:1;min-width:0}
.li .t{font-weight:700;overflow-wrap:anywhere}
.li .k{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.amt{font-family:var(--serif);font-size:18px;white-space:nowrap}
.amt.in{color:var(--good-ink)}
.empty{color:var(--muted);padding:12px 4px}
.empty .btn{margin-top:8px}
.wrapr{flex-wrap:wrap}
.coming{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ctile{background:var(--soft);border-radius:16px;padding:12px}
.ctile .d{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ctile .n{font-weight:700;margin:2px 0;overflow-wrap:anywhere}
.ctile .a{font-family:var(--serif);font-size:19px}
.ctile.inc .a{color:var(--good-ink)}
.wins .li{border:0;padding:6px 0}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;color:transparent}
.tick.on{background:var(--good);border-color:var(--good);color:#fff;animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.cheer{font-family:var(--serif);font-style:italic;color:var(--accent-ink);margin:8px 0}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--soft);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}
.dump input[type=text]{width:100%}
.note{display:flex;gap:10px;align-items:center;padding:6px 0}
.note.done span{text-decoration:line-through;color:var(--muted)}
.note span{flex:1;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;width:32px;height:32px;border-radius:50%}
.x:hover{background:var(--soft)}

/* forms */
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;min-height:44px;padding:9px 13px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=color]{width:52px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:2px}
textarea{resize:vertical;min-height:110px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.field>.lbl{font-weight:700;font-size:14px}
.field .hint{font-size:12.5px;color:var(--muted)}
.field .prev{font-size:12.5px;color:var(--accent-ink);font-weight:700;min-height:1em}
.field .ferr{font-size:13px;color:var(--bad);font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--card);box-shadow:var(--shadow);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.catpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.catpick label{border:1px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center;cursor:pointer;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;overflow-wrap:anywhere}
.catpick label span{font-size:20px}
.catpick input{position:absolute;opacity:0;pointer-events:none}
.catpick label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.catpick label:has(input:focus-visible){outline:2px solid var(--accent)}
.bigamt{display:flex;align-items:center;justify-content:center;gap:4px;border-radius:20px;background:var(--soft);padding:10px}
.bigamt span{font-family:var(--serif);font-size:30px;color:var(--muted)}
.bigamt input{font-family:var(--serif);font-size:58px;text-align:center;border:0;background:transparent;min-height:0;padding:0;width:100%;max-width:340px}
.bigamt input:focus{outline:none}
.bigamt:focus-within{outline:2px solid var(--accent)}
.chips{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.emojirow{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.emojirow button{border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:18px;width:36px;height:36px;cursor:pointer;padding:0}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* modal layers */
.layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(17,21,19,.42)}
#modal{z-index:50} #confirm{z-index:70}
.sheet{background:var(--card);color:var(--ink);border-radius:26px;padding:24px;width:100%;max-width:560px;max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);position:relative}
.sheet.wide{max-width:760px}
.sheet h2{margin-bottom:14px;padding-right:30px}
.sheet .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.sheet .actions .sp{flex:1}
.how{width:100%;border-collapse:collapse}
.how td{padding:6px 4px;border-bottom:1px solid var(--line)}
.how td:last-child{text-align:right;font-family:var(--serif);white-space:nowrap}
.how tr.tot td{font-weight:800;border-top:2px solid var(--ink)}

/* toast & tooltip */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:95;pointer-events:none;display:flex;justify-content:center;width:max-content;max-width:calc(100vw - 32px)}
#toast .t{background:var(--ink);color:var(--bg);border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.2)}
#toast button{pointer-events:auto;background:none;border:1px solid color-mix(in srgb,var(--bg) 50%,transparent);color:var(--bg);border-radius:999px;padding:4px 12px;font-weight:800;cursor:pointer}
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:700;border-radius:10px;padding:6px 10px;white-space:nowrap;display:none}

.fab{display:none}
/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.chart .grid{stroke:var(--line)}
.chart g.col{cursor:default}
.chart g.col[data-act]{cursor:pointer}
.chart:hover g.col{opacity:.5}
.chart:hover g.col:hover{opacity:1}
.chart .hit{fill:transparent}
.chart .hl{stroke:var(--ink);stroke-width:1.5}
.anim .chart rect.b{animation:grow .65s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.anim .donut g.segs{animation:spin .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:95px 95px}
@keyframes spin{from{transform:rotate(-70deg) scale(.86);opacity:0}to{transform:none;opacity:1}}
.legendc{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:6px}
.legendc i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.donutwrap{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;align-items:center}
.donut{width:190px;height:190px}
.donut circle.seg{transition:stroke-width .15s,opacity .15s;cursor:default}
.donut circle.seg[data-act]{cursor:pointer}
.donut text{pointer-events:none;fill:var(--ink)}
.donut .cl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;fill:var(--muted)}
.donut .cv{font-family:var(--serif);font-size:21px}
.donut .cp{font-size:11px;fill:var(--muted);font-weight:700}
.dleg{list-style:none;margin:0;padding:0}
.dleg li{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:10px;font-size:13.5px;transition:opacity .15s}
.dleg li[data-act]{cursor:pointer}
.dleg li:hover{background:var(--soft)}
.dleg .dt{width:10px;height:10px;border-radius:50%;flex:none}
.dleg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dleg .pc{color:var(--muted);font-size:12px;width:38px;text-align:right}
.dleg .av{font-family:var(--serif);white-space:nowrap}
.donutwrap.hl circle.seg{opacity:.2}
.donutwrap.hl circle.seg.on{opacity:1;stroke-width:31}
.donutwrap.hl .dleg li{opacity:.4}
.donutwrap.hl .dleg li.on{opacity:1}
.ring text{font-family:var(--serif);font-size:17px;fill:var(--ink)}

/* tables */
.tw{overflow-x:auto;max-width:100%}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr[data-act]{cursor:pointer}
.tbl tr[data-act]:hover td{background:var(--soft)}
.tbl .num{text-align:right;white-space:nowrap;font-family:var(--serif);font-size:16px}
.tbl .mcat{display:none;font-size:12px;color:var(--muted)}
.tbl td.w{overflow-wrap:anywhere}

/* themes */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ttile{border:1.5px solid var(--line);border-radius:18px;padding:10px;cursor:pointer;background:var(--card);text-align:left;position:relative;color:var(--ink)}
.ttile.on{border:2.5px solid var(--accent)}
.ttile .ck{position:absolute;top:8px;right:10px;font-weight:800;color:var(--accent-ink)}
.tprev{border-radius:12px;height:78px;padding:8px;display:flex;gap:6px;margin-bottom:8px}
.tprev .mini{flex:1;background:#fff;border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:5px}
.tprev .pb{height:9px;width:46px;border-radius:999px}
.tprev .ln{height:4px;border-radius:99px}
.tprev .bars{display:flex;gap:3px;align-items:flex-end;height:22px}
.tprev .bars i{flex:1;border-radius:2px}
.tprev .tabsw{display:flex;flex-direction:column;gap:3px;width:12px}
.tprev .tabsw i{flex:1;border-radius:4px 0 0 4px}
.ttile b{display:block;font-size:14px}
.ttile span{font-size:12px;color:var(--muted)}

/* guide */
.guide ol li,.guide ul li{margin-bottom:6px}

/* focus mode */
body.focusmode .nofocus{display:none !important}

/* recovery */
.recov{max-width:760px;margin:40px auto;padding:0 16px}

/* motion */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

/* tablet */
@media (max-width:1100px){
  .app{grid-template-columns:220px minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.hero-grid{grid-template-columns:minmax(0,1fr)}
  .main{padding:0 24px 90px}
}
/* mobile */
@media (max-width:860px){
  .app{display:block}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex-direction:row}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;width:100%;scrollbar-width:none}
  .nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;min-width:64px;border-radius:12px;white-space:nowrap}
  .main{padding:0 16px 150px}
  h1{font-size:32px}
  .topbar .logbtn{display:none}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:30px;border:0;box-shadow:0 10px 26px rgba(0,0,0,.25);z-index:41;align-items:center;justify-content:center;cursor:pointer}
  #toast{bottom:160px}
  .g2{grid-template-columns:minmax(0,1fr)}
  .donutwrap{grid-template-columns:minmax(0,1fr);justify-items:center}
  .dleg{width:100%}
  .tbl .hm{display:none}
  .tbl .mcat{display:block}
}
/* small phones */
@media (max-width:600px){
  .layer{align-items:flex-end;padding:0}
  .sheet{border-radius:26px 26px 0 0;max-height:94vh;max-width:none}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .v{font-size:22px}
  .card{padding:16px;border-radius:20px}
  .li.wrapr{flex-wrap:wrap}
  .li.wrapr .btns{width:100%;display:flex;gap:8px;flex-wrap:wrap;padding-left:50px}
  .focus{flex-direction:column}
}
@media print{
  body{background:#fff}
  .side,.topbar,.fab,#toast,.noprint,.btn,.help,#sampleBanner,.foot{display:none !important}
  .app{display:block}
  .main{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid}
}

  const cols = days.map(d => { const evs = eventsOn(d, filt); const cids = conflictIds(d); const ch = filt ? activeChores().filter(c => c.who === filt && choreOn(c, d)) : []; return html`<div class="card wday ${d === t ? 'today' : ''} ${d < t ? 'past' : ''}" data-day="${d}"><div class="wd"><span>${wdShort(weekday(d))} <b>${+d.slice(8)}</b></span><button class="x add" type="button" data-act="newev" data-v="${d}" aria-label="${'Add an event on ' + dLong(d)}">+</button></div>
    <div class="evl">${evs.length ? evs.map(e => evChip(e, d, cids.has(e.id))) : html`<span class="tiny muted">Free</span>`}</div>
    ${ch.length ? html`<ul class="wlist">${ch.map(c => html`<li class="${doneRec(c.id, d) ? 'dn' : ''}">${c.emoji || '✨'} ${c.name}</li>`)}</ul>` : ''}
    <div class="meal ${S.meals[d] ? '' : 'none'}" data-act="editmeal" data-v="${d}" role="button" tabindex="0" aria-label="${'Dinner on ' + dLong(d) + ': ' + (S.meals[d] || 'not planned')}">🍽️ ${S.meals[d] || 'Dinner?'}</div></div>`; });
  const ag = agenda(t, UI.agenda, filt);
  return html`<div class="head"><div><div class="eyebrow">Family calendar</div><h1>Week of ${dfmt(UI.week, { month: 'long', day: 'numeric' })}</h1><p class="lead">Color shows who it’s for. ⚠ means two things overlap for the same person.</p></div>
  <div class="row noprint"><button class="btn ghost sm" type="button" data-act="wprev" aria-label="Previous week">‹</button><button class="btn ghost sm" type="button" data-act="wtoday">This week</button><button class="btn ghost sm" type="button" data-act="wnext" aria-label="Next week">›</button><button class="btn ghost sm" type="button" data-act="print">🖨 Fridge sheet</button><button class="btn primary sm" type="button" data-act="newev">+ Add event</button>${helpBtn('calendar')}</div></div>
  <div class="noprint">${chips}
  ${conf.length ? html`<div class="banner bad" data-testid="wconflicts"><p><b>⚠ ${plural(conf.length, 'overlap')} this week:</b></p><ul class="small" style="margin:0;width:100%">${conf.map(c => html`<li>${dLong(c.d)} — ${conflictText(c)}</li>`)}</ul></div>` : ''}
  <div class="week" data-testid="week">${cols}</div>
  <div class="card" style="margin-top:18px"><div class="card-t"><h2>Coming up</h2><span class="sp"></span><div class="seg" role="radiogroup" aria-label="How far ahead">${[7, 14, 30].map(n => html`<label><input type="radio" name="agn" data-act="agenda" value="${n}" ${UI.agenda === n ? raw('checked') : ''}>${n} days</label>`)}</div></div>
  ${ag.length ? html`<div class="tw"><table class="tbl" data-testid="agenda"><thead><tr><th>Day</th><th class="hm">Time</th><th>What</th><th class="hm">Who</th><th class="hm">Where</th></tr></thead><tbody>${ag.map(x => html`<tr data-act="editev" data-v="${x.e.id}" data-d="${x.d}" tabindex="0"><td style="white-space:nowrap">${relDay(x.d) === 'today' || relDay(x.d) === 'tomorrow' ? relDay(x.d)[0].toUpperCase() + relDay(x.d).slice(1) : dLong(x.d)}</td><td class="hm" style="white-space:nowrap">${timeRange(x.e)}</td><td class="w">${x.e.emoji ? x.e.emoji + ' ' : ''}${x.e.title}<span class="mcat">${timeRange(x.e) + ' · ' + whoText(x.e)}</span></td><td class="hm">${whoText(x.e)}</td><td class="hm">${x.e.place || '—'}</td></tr>`)}</tbody></table></div>` : emptyState('Nothing in the next ' + UI.agenda + ' days.', 'Add an event', 'newev')}
  <div class="row" style="margin-top:12px"><button class="btn sm ghost" type="button" data-act="exportcal">Export next 90 days (CSV)</button></div></div></div>
  <div class="print-only">${fridgeSheet(days)}</div>`;
}
function fridgeSheet(days) {

  <table class="ft"><thead><tr><th></th>${days.map(d => html`<th>${wdShort(weekday(d))} ${+d.slice(8)}</th>`)}</tr></thead><tbody>
  <tr><th>Calendar</th>${days.map(d => html`<td>${eventsOn(d).map(e => html`<div class="fe"><b>${e.start ? fmtTime(e.start) : '•'}</b> ${e.title}${e.who.length ? html` <i>(${whoText(e)})</i>` : ''}</div>`)}</td>`)}</tr>
  <tr><th>Dinner</th>${days.map(d => html`<td>${S.meals[d] || ''}</td>`)}</tr>

  </tbody></table></div>`;
}

/* ---------- CHORES & STARS ---------- */
function vChores() {
  const t = today(); const ws = weekStartOf(t); const kids = S.members.filter(m => m.kid); const people = S.members;
  const filt = UI.choreWho;
  const cards = people.length ? html`<div class="g4" style="margin-bottom:18px" data-testid="starcards">${(kids.length ? kids : people).map(m => { const w = weekStars(m.id, ws), bal = starBalance(m.id); return html`<div class="card kpi scard" style="--mc:${mColor(m)}"><div class="k">${mLabel(m)}</div><div class="v" data-testid="bal">⭐ ${bal}</div><div class="s">${plural(w, 'star')} this week · ${plural(starsEarned(m.id), 'star')} earned in all</div></div>`; })}</div>` : '';
  const today_ = choresToday(null).filter(x => !filt || x.c.who === filt);
  const all = S.chores.filter(c => !c.archived && (!filt || c.who === filt)).sort((a, b) => (mLabel(memberOf(a.who))).localeCompare(mLabel(memberOf(b.who))) || a.name.localeCompare(b.name));
  const chips = people.length ? html`<div class="row fchips" role="group" aria-label="Show chores for">${[{ id: '', name: 'Everyone' }, ...people].map(m => html`<button type="button" class="qbtn ${filt === m.id ? 'on' : ''}" data-act="chorewho" data-v="${m.id}" aria-pressed="${filt === m.id ? 'true' : 'false'}">${m.id ? mdot(m) : ''}${m.emoji ? m.emoji + ' ' : ''}${m.name}</button>`)}</div>` : '';
  const days = Array.from({ length: 28 }, (_, i) => addDays(t, i - 27));
  const weeks = [3, 2, 1, 0].map(k => addDays(ws, -7 * k));
  const ser = (kids.length ? kids : people).slice(0, 6).map(m => ({ name: m.name, color: mColor(m), vals: weeks.map(w => weekStars(m.id, w)) }));
  const donutItems = [...people, null].map(m => ({ id: m ? m.id : 'none', label: m ? m.name : 'Not assigned', emoji: m ? m.emoji : '', color: mColor(m), val: S.log.filter(l => l.date >= days[0] && (m ? l.by === m.id : !l.by)).length })).filter(x => x.val > 0).sort((a, b) => b.val - a.val);
  const rewards = html`<div class="card"><div class="card-t"><h2>🎁 Rewards</h2><span class="sp"></span><button class="btn sm ghost" type="button" data-act="newreward">+ Reward</button>${helpBtn('rewards')}</div>${S.rewards.length ? html`<ul class="list">${S.rewards.slice().sort((a, b) => a.cost - b.cost).map(r => html`<li class="li"><div class="tile">${r.emoji || '🎁'}</div><div class="mid" data-act="editreward" data-v="${r.id}" tabindex="0" role="button"><div class="t">${r.name}</div><div class="k">${plural(r.cost, 'star')}</div></div><button class="btn sm primary" type="button" data-act="redeem" data-v="${r.id}" ${people.length ? '' : raw('disabled')}>Use stars</button></li>`)}</ul>` : emptyState('Add a few rewards your kids can save stars for.', '+ Reward', 'newreward')}
    ${S.redeems.length ? html`<details style="margin-top:12px"><summary class="small">Rewards used (${S.redeems.length})</summary><ul class="list">${S.redeems.slice().sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.at - a.at).slice(0, 30).map(r => { const m = memberOf(r.memberId); return html`<li class="li"><div class="tile">${r.emoji || '🎁'}</div><div class="mid"><div class="t">${r.name}</div><div class="k">${mLabel(m)} · ${dLong(r.date)} · −${plural(r.cost, 'star')}</div></div><button class="x" type="button" data-act="redeemdel" data-v="${r.id}" aria-label="Give these stars back">×</button></li>`; })}</ul></details>` : ''}</div>`;
  return html`<div class="head"><div><div class="eyebrow">Chores & stars</div><h1>Many hands, light work</h1><p class="lead">Tick a chore to earn its stars. Missed days never pile up — each chore waits as one item.</p></div><div class="row noprint"><button class="btn primary" type="button" data-act="newchore">+ Add a chore</button><button class="btn ghost" type="button" data-act="starter">Starter chores</button><button class="btn ghost" type="button" data-act="print">🖨 Chore chart</button>${helpBtn('chores')}</div></div>
  <div class="noprint">${cards}${chips}
  <div class="g2" style="margin-bottom:18px"><div class="card"><div class="card-t"><h2>Today’s chores</h2></div>${today_.length ? html`<ul class="list" data-testid="choretoday">${today_.map(x => choreRow(x.c))}</ul>` : emptyState(S.chores.length ? 'Nothing due today. Enjoy it!' : 'No chores yet. Starter chores are a quick way in.', S.chores.length ? null : 'Add starter chores', 'starter')}</div>${rewards}</div>
  <div class="g2" style="margin-bottom:18px"><div class="card"><div class="card-t"><h2>Stars per week</h2></div>${ser.length && ser.some(s => s.vals.some(v => v > 0)) ? barChart(weeks.map(w => dShort(w)), ser, 220, { tips: weeks.map(w => 'Week of ' + dShort(w)), aria: 'Stars earned per week, last 4 weeks' }) : html`<p class="empty">Stars earned each week show up here.</p>`}</div>
  <div class="card"><div class="card-t"><h2>Who pitched in</h2><span class="tiny muted">last 28 days</span></div>${donutBlock(donutItems, 'Chores done', String(sum(donutItems, x => x.val)), { empty: 'Ticked chores show up here.' })}</div></div>
  <div class="card"><div class="card-t"><h2>All chores</h2><span class="sp"></span><button class="btn sm ghost" type="button" data-act="exportchores">Export history (CSV)</button></div>${all.length ? html`<ul class="list" data-testid="choreall">${all.map(c => choreRow(c))}</ul>` : html`<p class="empty">No chores${filt ? ' for this person' : ''} yet.</p>`}
  ${S.chores.some(c => c.archived) ? html`<details style="margin-top:12px"><summary class="small">Paused chores (${S.chores.filter(c => c.archived).length})</summary><ul class="list">${S.chores.filter(c => c.archived).map(c => html`<li class="li"><div class="mid" data-act="editchore" data-v="${c.id}" tabindex="0" role="button"><div class="t">${c.name}</div><div class="k">Paused · ${freqText(c)}</div></div></li>`)}</ul></details>` : ''}</div></div>
  <div class="print-only">${choreChart()}</div>`;
}
function choreChart() {
  const ws = weekStartOf(today()); const days = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
  return html`<div class="fridge"><div class="fh"><b>Chore chart · week of ${dfmt(ws, { month: 'long', day: 'numeric' })}</b><span>${APP}</span></div>${[...S.members, null].map(m => { const list = activeChores().filter(c => m ? c.who === m.id : !c.who); if (!list.length) return ''; return html`<h3>${m ? mLabel(m) : 'Anyone'}</h3><table class="ft"><thead><tr><th>Chore</th>${days.map(d => html`<th>${wdShort(weekday(d))}</th>`)}</tr></thead><tbody>${list.map(c => html`<tr><td>${c.name}${c.stars ? ' (' + c.stars + '⭐)' : ''}</td>${days.map(d => html`<td class="cb">${choreOn(c, d) ? (doneRec(c.id, d) ? '☑' : '☐') : ''}</td>`)}</tr>`)}</tbody></table>`; })}</div>`;
}

/* ---------- MEALS & SHOPPING ---------- */
function vMeals() {
  if (!UI.week) UI.week = weekStartOf(today());
  const t = today(); const days = Array.from({ length: 7 }, (_, i) => addDays(UI.week, i));
  const cats = SHOP_CATS.map(([k, l]) => ({ k, l, items: S.shop.filter(s => s.cat === k).sort((a, b) => (a.done - b.done) || a.at - b.at) })).filter(c => c.items.length);
  const left = S.shop.filter(s => !s.done).length;
  return html`<div class="head"><div><div class="eyebrow">Meals & shopping</div><h1>What’s for dinner?</h1><p class="lead">Plan dinners for the week and keep one shared shopping list.</p></div><div class="row noprint"><button class="btn ghost sm" type="button" data-act="wprev" aria-label="Previous week">‹</button><button class="btn ghost sm" type="button" data-act="wtoday">This week</button><button class="btn ghost sm" type="button" data-act="wnext" aria-label="Next week">›</button><button class="btn ghost sm" type="button" data-act="print">🖨 Print list</button>${helpBtn('meals')}</div></div>
  <div class="g2 noprint"><div class="card"><div class="card-t"><h2>Dinners · week of ${dShort(UI.week)}</h2><span class="sp"></span><button class="btn sm ghost" type="button" data-act="copyweek">Copy last week</button></div>
    <div class="meals" data-testid="meals">${days.map(d => html`<div class="mrow2 ${d === t ? 'today' : ''}"><label for="${'meal_' + d}"><b>${wdShort(weekday(d))}</b> <span class="muted">${dShort(d)}</span></label><input type="text" id="${'meal_' + d}" data-meal="${d}" maxlength="80" value="${S.meals[d] || ''}" placeholder="${d < t ? '—' : 'e.g. Tacos'}"></div>`)}</div><p class="tiny muted" style="margin-top:8px">Changes save when you press Enter or leave the box.</p></div>
  <div class="card"><div class="card-t"><h2>Shopping list</h2><span class="sp"></span><span class="tag ${left ? 'gold' : 'good'}" data-testid="shopleft">${left ? left + ' to get' : 'All got'}</span>${helpBtn('shop')}</div>
    <div class="row" style="margin-bottom:10px"><label class="sr" for="shopIn">Add an item</label><input type="text" id="shopIn" maxlength="80" placeholder="Milk, apples, trash bags… press Enter" style="flex:1;min-width:160px"><label class="sr" for="shopCat">Aisle</label><select id="shopCat" style="width:auto"><option value="">Aisle: guess for me</option>${SHOP_CATS.map(([k, l]) => html`<option value="${k}">${l}</option>`)}</select></div>
    ${cats.length ? cats.map(c => html`<div class="scat"><div class="eyebrow" style="margin:10px 0 4px">${c.l}</div>${c.items.map(s => html`<div class="note ${s.done ? 'done' : ''}"><input type="checkbox" id="${'sh_' + s.id}" data-act="shoptoggle" data-v="${s.id}" ${s.done ? raw('checked') : ''}><label for="${'sh_' + s.id}">${s.text}</label><button class="x" type="button" data-act="shopdel" data-v="${s.id}" aria-label="${'Remove ' + s.text}">×</button></div>`)}</div>`) : html`<p class="empty">Your list is empty. Add items as you notice them.</p>`}
    ${S.shop.some(s => s.done) ? html`<button class="btn sm ghost" type="button" data-act="shopclear" style="margin-top:8px">Clear checked items</button>` : ''}</div></div>
  <div class="print-only"><h2>Shopping list · ${dLong(t)}</h2>${SHOP_CATS.map(([k, l]) => { const it = S.shop.filter(s => s.cat === k && !s.done); return it.length ? html`<h3>${l}</h3><ul>${it.map(s => html`<li>☐ ${s.text}</li>`)}</ul>` : ''; })}<h3>Dinners</h3><ul>${days.map(d => html`<li>${dLong(d)}: ${S.meals[d] || '—'}</li>`)}</ul></div>`;
}

/* ---------- FAMILY BOARD ---------- */

function vBoard() {
  const cds = countdownList(today());
  return html`<div class="head"><div><div class="eyebrow">Family board</div><h1>Notes, numbers & countdowns</h1><p class="lead">The stuff that usually lives on the fridge door.</p></div><div class="row noprint"><button class="btn ghost" type="button" data-act="print">🖨 Info sheet</button>${helpBtn('board')}</div></div>
  <div class="noprint"><div class="card" style="margin-bottom:18px"><div class="card-t"><h2>Notes</h2></div><div class="row" style="margin-bottom:12px"><label class="sr" for="noteIn">Write a note</label><input type="text" id="noteIn" maxlength="300" placeholder="Picture day Thursday! Press Enter to post" style="flex:1;min-width:180px">${S.members.length ? html`<label class="sr" for="noteBy">From</label><select id="noteBy" style="width:auto"><option value="">From: —</option>${S.members.map(m => html`<option value="${m.id}">${mLabel(m)}</option>`)}</select>` : ''}</div>
    ${S.notes.length ? html`<div class="notes" data-testid="notes">${S.notes.slice().sort((a, b) => b.pinned - a.pinned || b.at - a.at).map(noteCard)}</div>` : html`<p class="empty">Post reminders for everyone. Pin the important ones to Today.</p>`}</div>
  <div class="g2"><div class="card"><div class="card-t"><h2>Countdowns & birthdays</h2><span class="sp"></span><button class="btn sm ghost" type="button" data-act="newcd">+ Countdown</button></div>${cds.length ? html`<div class="cds" data-testid="cds">${cds.map(c => html`<div class="cdt ${c.days < 0 ? 'past' : ''}" ${c.kind === 'cd' ? html`data-act="editcd" data-v="${c.id}" role="button" tabindex="0"` : html`data-act="editmember" data-v="${c.id}" role="button" tabindex="0"`}><span class="ce" aria-hidden="true">${c.emoji}</span><div style="min-width:0"><b>${c.name}</b><span class="tiny muted">${dFull(c.date)}</span></div><span class="cdn">${daysText(c.days)}</span></div>`)}</div>` : emptyState('Add trips, holidays and special days. Birthdays from Settings → Family appear here too.', '+ Countdown', 'newcd')}</div>
  <div class="card"><div class="card-t"><h2>Important info</h2><span class="sp"></span><button class="btn sm ghost" type="button" data-act="newinfo">+ Add</button></div>${S.info.length ? html`<dl class="kv info" data-testid="info">${S.info.map(i => html`<dt data-act="editinfo" data-v="${i.id}" role="button" tabindex="0">${i.label}</dt><dd>${i.value}</dd>`)}</dl>` : emptyState('Doctor, school, babysitter, Wi-Fi — everything a sitter or grandparent needs.', 'Add common labels', 'infostarter')}<p class="tiny muted" style="margin-top:10px">Stored in this browser only and not encrypted — skip passwords you need to keep private.</p></div></div></div>
  <div class="print-only"><h2>${S.settings.family ? 'The ' + S.settings.family + ' family' : 'Family'} — important info</h2><dl class="kv">${S.info.map(i => html`<dt>${i.label}</dt><dd>${i.value}</dd>`)}</dl>${S.members.length ? html`<h3>Family</h3><ul>${S.members.map(m => html`<li>${m.name}${m.birthday ? ' — birthday ' + dfmt(m.birthday, { month: 'long', day: 'numeric' }) : ''}</li>`)}</ul>` : ''}<p class="tiny">Printed ${dLong(today())} from ${APP}</p></div>`;
}

/* ---------- SETTINGS ---------- */

    for (const [k, lim] of Object.entries(LIMITS)) if (Array.isArray(obj[k]) && obj[k].length > lim) { no('This backup has more ' + k + ' than Busy Nest can hold (' + lim + '), so nothing was changed.'); return; }

/* ---------- boot (§6) ---------- */
function boot() {
  wire();
  let r = readRaw();
  if (!r.ok) { storageMode = 'memory'; S = sampleData(); applyLook(); render(); updSave(); welcome(true); return; }
  if (r.raw === null) { S = sampleData(); lastLen = JSON.stringify(S).length; applyLook(); render(); welcome(false); return; }
  let parsed; try { parsed = JSON.parse(r.raw); } catch (e) { parsed = undefined; }
  if (parsed === undefined) { S = blankData(); UI.recovery = { raw: r.raw, reason: 'The stored data is not readable — it may have been damaged.', fixes: [], data: null }; applyLook(); render(); return; }
  const s = sanitize(parsed);
  if (!s.data) { S = blankData(); UI.recovery = { raw: r.raw, reason: s.fixes[0], fixes: [], data: null }; applyLook(); render(); return; }
  if (s.fixes.length) { S = s.data; UI.recovery = { raw: r.raw, reason: '', fixes: s.fixes, data: s.data }; applyLook(); render(); return; }
  S = s.data; lastRaw = r.raw; lastLen = r.raw.length;

  try { localStorage.setItem(LS_KEY + '.probe', '1'); localStorage.removeItem(LS_KEY + '.probe'); saveOk = true; } catch (e) { saveOk = false; saveMsg = errName(e); }

}
