<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="color-scheme" content="light dark">
<title>Lesson Lantern — Free Demo</title>
<style>
:root{
  --sans: ui-rounded,"SF Pro Rounded","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,"Noto Sans Thai",sans-serif;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --bg:#F4F3EE;--card:#FFFFFF;--soft:#ECEFE8;--line:#E2E5DD;--ink:#1F2A26;--muted:#5E6A63;--accent:#4F7C67;--accent-2:#E58A6B;--gold:#E1B04B;--good:#3E8A62;--bad:#C4553F;
  --on-accent:#FFFFFF;--on-accent-2:#1F2A26;--focus-bg:#1F2A26;--focus-ink:#F4F3EE;--accent-ink:#4F7C67;--accent2-ink:#B4553A;--good-ink:#3E8A62;--gold-ink:#8A6A1F;
  --shadow:0 1px 2px rgba(31,42,38,.04),0 12px 32px rgba(31,42,38,.06);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:500;letter-spacing:-.015em;margin:0}
h1{font-size:40px;line-height:1.1}
h2{font-size:22px;line-height:1.2}
h3{font-size:18px}
p{margin:0 0 .6em}
a{color:var(--accent-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:var(--muted);margin-bottom:6px}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:200;background:var(--card);padding:8px 14px;border-radius:999px}
.skip:focus{left:8px}

/* layout */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 14px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line);background:var(--bg)}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand b{font-family:var(--serif);font-weight:500;font-size:21px;display:block;line-height:1.1}
.brand span{font-size:11.5px;line-height:1.3;color:var(--muted);font-style:italic;font-family:var(--serif);display:block}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
.nav a:hover{background:var(--soft)}
.nav a[aria-current=page]{background:var(--card);box-shadow:var(--shadow);color:var(--accent-ink)}
.nav svg,.ico{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
.main{min-width:0;padding:0 40px 90px;max-width:1220px;width:100%;justify-self:center}
.topbar{display:flex;align-items:center;gap:10px;padding:18px 0 10px;flex-wrap:wrap}
.topbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;flex:none}
.chip.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card));border-color:var(--bad);color:var(--ink)}
.chip.bad .dot{background:var(--bad)}
.view{min-width:0}
.view section{margin-bottom:22px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:14px 0 22px}
.head .lead{color:var(--muted);margin-top:6px;max-width:640px}
.foot{color:var(--muted);font-size:12.5px;margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}

/* cards & grids */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);min-width:0;position:relative}
.card-t{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card-t h2,.card-t h3{font-size:20px}
.card-t .sp{flex:1}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px}
.kpi .k{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--muted)}
.kpi .v{font-family:var(--serif);font-size:30px;line-height:1.15;margin:6px 0 2px;overflow-wrap:anywhere}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.good .v{color:var(--good-ink)} .kpi.gold .v{color:var(--gold-ink)} .kpi.warm .v{color:var(--accent2-ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;font-weight:700;font-size:14px;padding:10px 18px;border:1px solid transparent;cursor:pointer;background:var(--soft);color:var(--ink);min-height:40px;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px;min-height:32px}
.btn.link{background:none;padding:0;min-height:0;border:0;text-decoration:underline;color:var(--accent-ink);font-weight:600}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.help{width:21px;height:21px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--muted);font-size:12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.tag.good{background:color-mix(in srgb,var(--good) 16%,var(--card));color:var(--ink)}
.tag.bad{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--ink)}
.tag.warm{background:color-mix(in srgb,var(--accent-2) 20%,var(--card));color:var(--ink)}
.tag.gold{background:color-mix(in srgb,var(--gold) 25%,var(--card));color:var(--ink)}
.banner{border-radius:18px;padding:14px 18px;margin:8px 0 16px;background:color-mix(in srgb,var(--gold) 18%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card));border-color:var(--bad)}
.banner.info{background:color-mix(in srgb,var(--accent) 10%,var(--card));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.banner p{margin:0;flex:1;min-width:220px}

/* hero */
.hero{overflow:hidden;background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%),radial-gradient(70% 60% at 100% 0%,color-mix(in srgb,var(--accent-2) 12%,transparent),transparent 70%),var(--card)}
.big{font-family:var(--serif);font-size:clamp(66px,9vw,112px);line-height:1;letter-spacing:-.03em;margin:8px 0 6px;display:flex;align-items:baseline;flex-wrap:wrap}
.big .sym{font-size:.4em;margin:0 .08em;color:var(--muted)}
.big .frac{font-size:.42em;color:var(--accent-ink)}
.hero .sub{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--muted);margin-bottom:14px}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.over>i{background:var(--accent-2)}
.bar.gold>i{background:var(--gold)} .bar.good>i{background:var(--good)} .bar.warm>i{background:var(--accent-2)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.qbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:40px}
.qbtn:hover{background:var(--soft)}
.divider{border-top:1.5px dashed var(--line);margin:14px 0}

/* focus card */
.focus{background:var(--focus-bg);color:var(--focus-ink);border-radius:24px;padding:22px;display:flex;gap:16px;align-items:flex-start;margin-bottom:18px;box-shadow:var(--shadow)}
.focus .em{width:46px;height:46px;border-radius:50%;background:color-mix(in srgb,var(--focus-ink) 14%,transparent);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.focus .eyebrow{color:color-mix(in srgb,var(--focus-ink) 70%,transparent)}
.focus .txt{font-family:var(--serif);font-size:25px;line-height:1.2}
.focus .sub{opacity:.82;margin:6px 0 12px}
.focus .btn.ghost{color:var(--focus-ink);border-color:color-mix(in srgb,var(--focus-ink) 35%,transparent)}
.focus .btn.soft{background:color-mix(in srgb,var(--focus-ink) 14%,transparent);color:var(--focus-ink)}

/* lists */
.list{list-style:none;margin:0;padding:0}
.li{display:flex;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line);border-radius:12px;min-width:0}
.li:last-child{border-bottom:0}
.li[data-act]{cursor:pointer}
.li[data-act]:hover{background:var(--soft)}
.tile{width:38px;height:38px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.li .mid{flex:1;min-width:0}
.li .t{font-weight:700;overflow-wrap:anywhere}
.li .k{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.amt{font-family:var(--serif);font-size:18px;white-space:nowrap}
.amt.in{color:var(--good-ink)}
.empty{color:var(--muted);padding:12px 4px}
.empty .btn{margin-top:8px}
.wrapr{flex-wrap:wrap}
.coming{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ctile{background:var(--soft);border-radius:16px;padding:12px}
.ctile .d{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ctile .n{font-weight:700;margin:2px 0;overflow-wrap:anywhere}
.ctile .a{font-family:var(--serif);font-size:19px}
.ctile.inc .a{color:var(--good-ink)}
.wins .li{border:0;padding:6px 0}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;color:transparent}
.tick.on{background:var(--good);border-color:var(--good);color:#fff;animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.cheer{font-family:var(--serif);font-style:italic;color:var(--accent-ink);margin:8px 0}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--soft);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}
.dump input[type=text]{width:100%}
.note{display:flex;gap:10px;align-items:center;padding:6px 0}
.note.done span{text-decoration:line-through;color:var(--muted)}
.note span{flex:1;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;width:32px;height:32px;border-radius:50%}
.x:hover{background:var(--soft)}

/* forms */
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;min-height:44px;padding:9px 13px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=color]{width:52px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:2px}
textarea{resize:vertical;min-height:110px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.field>.lbl{font-weight:700;font-size:14px}
.field .hint{font-size:12.5px;color:var(--muted)}
.field .prev{font-size:12.5px;color:var(--accent-ink);font-weight:700;min-height:1em}
.field .ferr{font-size:13px;color:var(--bad);font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--card);box-shadow:var(--shadow);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.catpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.catpick label{border:1px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center;cursor:pointer;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;overflow-wrap:anywhere}
.catpick label span{font-size:20px}
.catpick input{position:absolute;opacity:0;pointer-events:none}
.catpick label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.catpick label:has(input:focus-visible){outline:2px solid var(--accent)}
.bigamt{display:flex;align-items:center;justify-content:center;gap:4px;border-radius:20px;background:var(--soft);padding:10px}
.bigamt span{font-family:var(--serif);font-size:30px;color:var(--muted)}
.bigamt input{font-family:var(--serif);font-size:58px;text-align:center;border:0;background:transparent;min-height:0;padding:0;width:100%;max-width:340px}
.bigamt input:focus{outline:none}
.bigamt:focus-within{outline:2px solid var(--accent)}
.chips{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.emojirow{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.emojirow button{border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:18px;width:36px;height:36px;cursor:pointer;padding:0}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* modal layers */
.layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(17,21,19,.42)}
#modal{z-index:50} #confirm{z-index:70}
.sheet{background:var(--card);color:var(--ink);border-radius:26px;padding:24px;width:100%;max-width:560px;max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);position:relative}
.sheet.wide{max-width:760px}
.sheet h2{margin-bottom:14px;padding-right:30px}
.sheet .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.sheet .actions .sp{flex:1}
.how{width:100%;border-collapse:collapse}
.how td{padding:6px 4px;border-bottom:1px solid var(--line)}
.how td:last-child{text-align:right;font-family:var(--serif);white-space:nowrap}
.how tr.tot td{font-weight:800;border-top:2px solid var(--ink)}

/* toast & tooltip */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:95;pointer-events:none;display:flex;justify-content:center;width:max-content;max-width:calc(100vw - 32px)}
#toast .t{background:var(--ink);color:var(--bg);border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.2)}
#toast button{pointer-events:auto;background:none;border:1px solid color-mix(in srgb,var(--bg) 50%,transparent);color:var(--bg);border-radius:999px;padding:4px 12px;font-weight:800;cursor:pointer}
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:700;border-radius:10px;padding:6px 10px;white-space:nowrap;display:none}

.fab{display:none}
/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.chart .grid{stroke:var(--line)}
.chart g.col{cursor:default}
.chart g.col[data-act]{cursor:pointer}
.chart:hover g.col{opacity:.5}
.chart:hover g.col:hover{opacity:1}
.chart .hit{fill:transparent}
.chart .hl{stroke:var(--ink);stroke-width:1.5}
.anim .chart rect.b{animation:grow .65s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.anim .donut g.segs{animation:spin .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:95px 95px}
@keyframes spin{from{transform:rotate(-70deg) scale(.86);opacity:0}to{transform:none;opacity:1}}
.legendc{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:6px}
.legendc i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.donutwrap{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;align-items:center}
.donut{width:190px;height:190px}
.donut circle.seg{transition:stroke-width .15s,opacity .15s;cursor:default}
.donut circle.seg[data-act]{cursor:pointer}
.donut text{pointer-events:none;fill:var(--ink)}
.donut .cl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;fill:var(--muted)}
.donut .cv{font-family:var(--serif);font-size:21px}
.donut .cp{font-size:11px;fill:var(--muted);font-weight:700}
.dleg{list-style:none;margin:0;padding:0}
.dleg li{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:10px;font-size:13.5px;transition:opacity .15s}
.dleg li[data-act]{cursor:pointer}
.dleg li:hover{background:var(--soft)}
.dleg .dt{width:10px;height:10px;border-radius:50%;flex:none}
.dleg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dleg .pc{color:var(--muted);font-size:12px;width:38px;text-align:right}
.dleg .av{font-family:var(--serif);white-space:nowrap}
.donutwrap.hl circle.seg{opacity:.2}
.donutwrap.hl circle.seg.on{opacity:1;stroke-width:31}
.donutwrap.hl .dleg li{opacity:.4}
.donutwrap.hl .dleg li.on{opacity:1}
.ring text{font-family:var(--serif);font-size:17px;fill:var(--ink)}

/* tables */
.tw{overflow-x:auto;max-width:100%}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr[data-act]{cursor:pointer}
.tbl tr[data-act]:hover td{background:var(--soft)}
.tbl .num{text-align:right;white-space:nowrap;font-family:var(--serif);font-size:16px}
.tbl .mcat{display:none;font-size:12px;color:var(--muted)}
.tbl td.w{overflow-wrap:anywhere}

/* themes */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ttile{border:1.5px solid var(--line);border-radius:18px;padding:10px;cursor:pointer;background:var(--card);text-align:left;position:relative;color:var(--ink)}
.ttile.on{border:2.5px solid var(--accent)}
.ttile .ck{position:absolute;top:8px;right:10px;font-weight:800;color:var(--accent-ink)}
.tprev{border-radius:12px;height:78px;padding:8px;display:flex;gap:6px;margin-bottom:8px}
.tprev .mini{flex:1;background:#fff;border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:5px}
.tprev .pb{height:9px;width:46px;border-radius:999px}
.tprev .ln{height:4px;border-radius:99px}
.tprev .bars{display:flex;gap:3px;align-items:flex-end;height:22px}
.tprev .bars i{flex:1;border-radius:2px}
.tprev .tabsw{display:flex;flex-direction:column;gap:3px;width:12px}
.tprev .tabsw i{flex:1;border-radius:4px 0 0 4px}
.ttile b{display:block;font-size:14px}
.ttile span{font-size:12px;color:var(--muted)}

/* guide */
.guide ol li,.guide ul li{margin-bottom:6px}

/* focus mode */
body.focusmode .nofocus{display:none !important}

/* recovery */
.recov{max-width:760px;margin:40px auto;padding:0 16px}

/* motion */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

/* tablet */
@media (max-width:1100px){
  .app{grid-template-columns:220px minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.hero-grid{grid-template-columns:minmax(0,1fr)}
  .main{padding:0 24px 90px}
}
/* mobile */
@media (max-width:860px){
  .app{display:block}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex-direction:row}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;width:100%;scrollbar-width:none}
  .nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;min-width:64px;border-radius:12px;white-space:nowrap}
  .main{padding:0 16px 150px}
  h1{font-size:32px}
  .topbar .logbtn{display:none}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:30px;border:0;box-shadow:0 10px 26px rgba(0,0,0,.25);z-index:41;align-items:center;justify-content:center;cursor:pointer}
  #toast{bottom:160px}
  .g2{grid-template-columns:minmax(0,1fr)}
  .donutwrap{grid-template-columns:minmax(0,1fr);justify-items:center}
  .dleg{width:100%}
  .tbl .hm{display:none}
  .tbl .mcat{display:block}
}
/* small phones */
@media (max-width:600px){
  .layer{align-items:flex-end;padding:0}
  .sheet{border-radius:26px 26px 0 0;max-height:94vh;max-width:none}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .v{font-size:22px}
  .card{padding:16px;border-radius:20px}
  .li.wrapr{flex-wrap:wrap}
  .li.wrapr .btns{width:100%;display:flex;gap:8px;flex-wrap:wrap;padding-left:50px}
  .focus{flex-direction:column}
}
@media print{
  body{background:#fff}
  .side,.topbar,.fab,#toast,.noprint,.btn,.help,#sampleBanner,.foot{display:none !important}
  .app{display:block}
  .main{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid}
}

  const mbs = minutesBySubject(m.id, yr.from, yr.to); const th = currentTheme();

  items.forEach((x, i) => { x.color = th.charts[i % 12]; });

  const grows = subs.map(s => { const g = gradeOf(s.id, yr.from, yr.to); const done = lessonsOf(s.id).filter(l => l.done && l.done >= yr.from && l.done <= yr.to).length; return { s, g, done, mins: mbs.get(s.id) || 0 }; });
  const gtable = html`<div class="card" style="margin-bottom:18px"><div class="card-t"><h2>Grades & progress</h2><span class="sp"></span><button class="btn sm ghost" type="button" data-act="exportgrades">Grades CSV</button></div>${grows.length ? html`<div class="tw"><table class="tbl" data-testid="grades"><thead><tr><th>Subject</th><th class="num">Lessons</th><th class="num hm">Graded</th><th class="num">Average</th><th class="num">Grade</th><th class="num hm">Hours</th></tr></thead><tbody>${grows.map(r => html`<tr data-act="opensubject" data-v="${r.s.id}" tabindex="0"><td class="w">${subLabel(r.s)}${r.s.archived ? html` <span class="tiny muted">(paused)</span>` : ''}</td><td class="num">${r.done}</td><td class="num hm">${r.g.n}</td><td class="num">${fmtPct(r.g.pct)}</td><td class="num"><b>${r.g.letter || '—'}</b></td><td class="num hm">${hrs1(r.mins)}</td></tr>`)}</tbody></table></div>` : emptyState('No subjects yet.', '+ Add a subject', 'newsubject', m.id)}

function reportCard(m) {

  return html`<div class="head"><div><div class="eyebrow">Guide</div><h1>How Lesson Lantern works</h1><p class="lead">Short and friendly. Read what you need, skip the rest.</p></div><button class="btn ghost noprint" type="button" data-act="print">Print this guide</button></div>
  ${c('Start here', html`<ol><li>Look around the Okafors’ example, then press <b>Start my own school</b>.</li><li>Add each student (Settings → Students, or the setup card on Today).</li><li>Check your school year: first and last day, which days you school, and your breaks.</li><li>Add subjects — <b>Starter subjects</b> adds common ones in one click. Pick the days each subject happens.</li><li>Open a subject and press <b>+ Add lessons</b>: “Lesson 1 to 120”, or paste the table of contents of your curriculum.</li><li>Each morning, open <b>Today</b> and tick lessons as you finish them.</li><li>Save a backup every week (Settings → Backup & data).</li></ol>`)}
  ${c('The rolling plan (why nothing piles up)', html`<p>Lessons are a list in order. Lesson Lantern puts the next unfinished lessons on each subject’s next school days. If you skip a day — sickness, a field trip, a slow morning — nothing turns “overdue”: the lessons simply move to the next day that subject happens.</p><ul><li><b>Take today off</b> (Today) or ⏸ (Week plan) adds a one-day break; everything moves forward.</li><li><b>Extra lesson</b> lets a child work ahead; the plan pulls everything closer.</li><li>Each subject shows when it will <b>finish</b>. If some lessons won’t fit before your last day, it tells you how many and suggests a fix (a second lesson a day, or an extra day).</li></ul>`)}

  ${c('Your data & privacy', html`<p>Lesson Lantern works offline and never sends your data anywhere. It is stored in this browser on this computer — not inside the HTML file and not in a cloud. There is no account and no sync, so use it on one computer. It is not encrypted, so anyone using this browser profile can open it. There are no notifications or reminders.</p>`)}
  ${c('Browser tips', html`<ul><li>Use Google Chrome on a computer, and open the same file in the same browser every time.</li><li>Clearing browsing data, or using a private/incognito window, erases what is stored.</li><li>Safari may clear data from files that have not been opened for about a week.</li><li>Moving to a new computer? Save a backup, copy it over, then use Restore a backup.</li></ul>`)}
  ${c('Make it yours', html`<p>Press <b>🎨 Colors</b> to try the 12 themes, or fine-tune three colors in Settings. Dark mode follows your computer, or pick Light/Dark yourself.</p>`)}
  <p class="foot">${APP} v${APP_VERSION}.</p>`;
}

    { delLabel: 'Remove', delTitle: m ? 'Remove ' + m.name + '?' : '', delMsg: () => m ? 'This removes ' + m.name + '’s ' + plural(S.subjects.filter(s => s.studentId === m.id).length, 'subject') + ', their lessons, attendance, learning log and books. You can undo right after.' : '', focus: '#f_name' });

/* ---------- subjects ---------- */
function openSubject(id, stuId) {
  if (!id && needStudent()) return;
  const s = id ? byId(S.subjects, id) : null; const st = S.settings;
  const v = s ? Object.assign({}, s) : { studentId: stuId && studentOf(stuId) ? stuId : (UI.who && studentOf(UI.who) ? UI.who : S.students[0].id), name: '', emoji: '', days: st.schoolDays.slice(), perDay: 1, minutes: 30, archived: false };
  const fields = [{ k: 'studentId', l: 'Student', t: 'select', req: true, opts: studentOpts() }, { k: 'name', l: 'Subject', req: true, max: 40, ph: 'e.g. Math' }, { k: 'emoji', l: 'Emoji (optional)', t: 'emoji' },
    { k: 'days', l: 'Which days?', t: 'checks', req: true, opts: [0, 1, 2, 3, 4, 5, 6].map(i => [i, wdShort(i)]), hint: 'Only your school days are used (Settings).' },
    { k: 'perDay', l: 'Lessons per day (1–5)', t: 'int', min: 1, maxv: 5, half: true }, { k: 'minutes', l: 'Minutes per lesson (0–600)', t: 'int', min: 0, maxv: 600, half: true, hint: 'Used for hours. You can change it on any lesson.' }];
  if (s) fields.push({ k: 'archived', l: 'Pause this subject (no new lessons planned; records stay)', t: 'check' });
  openForm(s ? 'Edit subject' : 'Add a subject', fields, v, x => {
    if (!studentOf(x.studentId)) { fieldErr('studentId', 'Please choose a student.'); return false; }
    if (!x.days.some(dd => st.schoolDays.includes(dd))) { fieldErr('days', 'Pick at least one of your school days (' + st.schoolDays.map(wdShort).join(', ') + ').'); return false; }
    const f = { studentId: x.studentId, name: x.name, emoji: x.emoji, days: x.days.slice().sort(), perDay: x.perDay, minutes: x.minutes, archived: s ? !!x.archived : false };
    let nid = null;
    const ok = commit(d => { if (s) { const y = byId(d.subjects, s.id); if (!y) return 'This subject no longer exists.'; if (y.studentId !== f.studentId) for (const a of d.activities) if (a.subjectId === y.id) a.studentId = f.studentId; Object.assign(y, f); } else { if (d.subjects.length >= LIMITS.subjects) return 'Subject limit reached (' + LIMITS.subjects + ').'; nid = uid('j'); d.subjects.push(Object.assign({ id: nid }, f)); } }, { toast: s ? 'Subject saved' : f.name + ' added — now add its lessons' });
    if (!ok) return false;
    if (nid) { closeLayer('modal'); openBulk(nid); return 'handled'; }
  }, s ? () => undoable('“' + s.name + '” deleted', d => { d.subjects = d.subjects.filter(y => y.id !== s.id); d.lessons = d.lessons.filter(l => l.subjectId !== s.id); for (const a of d.activities) if (a.subjectId === s.id) a.subjectId = ''; if (UI.subject === s.id) UI.subject = null; }) : null,
  { delTitle: s ? 'Delete “' + s.name + '”?' : '', delMsg: s ? 'This deletes its ' + plural(lessonsOf(s.id).length, 'lesson') + ', including scores and the days they were done (attendance from them goes too). Tip: “Pause” keeps everything. You can undo right after.' : '', focus: s ? null : '#f_name' });
}
function openStarter(stuId) {
  if (needStudent()) return;
  const sid = stuId && studentOf(stuId) ? stuId : (UI.who && studentOf(UI.who) ? UI.who : S.students[0].id);
  const fields = [{ k: 'studentId', l: 'For which student?', t: 'select', req: true, opts: studentOpts() }, { k: 'pick', l: 'Subjects', t: 'checks', req: true, opts: STARTER_SUBJECTS.map((r, i) => [i, r[0] + ' ' + r[1]]) }, { k: 'info', t: 'info', l: 'Each comes with typical days (Science Tue & Thu, History Mon/Wed/Fri…) and minutes. Change anything afterwards.' }];
  openForm('Starter subjects', fields, { studentId: sid, pick: STARTER_SUBJECTS.map((r, i) => r[4] ? i : -1).filter(i => i >= 0) }, x => {
    const m = studentOf(x.studentId); if (!m) return false; const have = new Set(S.subjects.filter(s => s.studentId === m.id).map(s => s.name.toLowerCase())); const sd = S.settings.schoolDays;
    const rows = x.pick.map(i => STARTER_SUBJECTS[i]).filter(r => r && !have.has(r[1].toLowerCase()));
    if (!rows.length) { fieldErr('pick', m.name + ' already has those subjects.'); return false; }
    return commit(d => { if (d.subjects.length + rows.length > LIMITS.subjects) return 'Subject limit reached.'; for (const r of rows) { let days = r[2].filter(dd => sd.includes(dd)); if (!days.length) days = sd.slice(); d.subjects.push({ id: uid('j'), studentId: m.id, name: r[1], emoji: r[0], days, perDay: 1, minutes: r[3], archived: false }); } }, { toast: plural(rows.length, 'subject') + ' added for ' + m.name + ' — open one to add lessons', undo: true }) ? undefined : false;
  }, null, { saveLabel: 'Add subjects' });
}

/* ---------- lessons ---------- */
function openBulk(subId) {
  const s = byId(S.subjects, subId); if (!s) return; const n = lessonsOf(s.id).length;
  const fields = [{ k: 'mode', l: 'How?', t: 'seg', opts: [['num', 'Numbered'], ['list', 'Paste a list']] },
    { k: 'prefix', l: 'Name', max: 40, ph: 'Lesson', show: x => x.mode === 'num', hint: 'e.g. “Lesson”, “Chapter”, “Unit 3 · Day”' },
    { k: 'from', l: 'From number', t: 'int', min: 0, maxv: 9999, half: true, show: x => x.mode === 'num' }, { k: 'to', l: 'To number', t: 'int', min: 0, maxv: 9999, half: true, show: x => x.mode === 'num', hint: 'Starting mid-book? Begin at your next lesson number.' },
    { k: 'list', l: 'One lesson per line', t: 'textarea', max: 60000, show: x => x.mode === 'list', hint: 'Copy the table of contents from your curriculum. Empty lines are skipped. Up to 1,000 at a time.' }];
  openForm('Add lessons to ' + s.name, fields, { mode: 'num', prefix: 'Lesson', from: n ? n + 1 : 1, to: n ? n + 20 : 120, list: '' }, x => {
    let titles = [];
    if (x.mode === 'num') { if (x.to < x.from) { fieldErr('to', 'This must be at least the first number.'); return false; } if (x.to - x.from + 1 > 1000) { fieldErr('to', 'Up to 1,000 lessons at a time.'); return false; } const p = (x.prefix || 'Lesson').slice(0, 70); for (let i = x.from; i <= x.to; i++) titles.push(p + ' ' + i); }
    else { titles = x.list.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => l.slice(0, 80)); if (!titles.length) { fieldErr('list', 'Paste at least one line.'); return false; } if (titles.length > 1000) { fieldErr('list', 'Up to 1,000 lines at a time (you pasted ' + titles.length + ').'); return false; } }
    if (S.lessons.length + titles.length > LIMITS.lessons) { toast('That would pass the ' + LIMITS.lessons.toLocaleString('en-US') + '-lesson limit.'); return false; }
    return undoable(plural(titles.length, 'lesson') + ' added to ' + s.name, d => { let o = nextOrder(d, s.id); for (const t of titles) d.lessons.push({ id: uid('l'), subjectId: s.id, title: t, order: o++, done: '', minutes: 0, got: null, of: null, note: '' }); }) ? undefined : false;
  }, null, { saveLabel: 'Add lessons' });
}
function openLesson(id) {
  const l = byId(S.lessons, id); if (!l) return; const s = subjectOf(l.subjectId); const t = today();
  const pd = planFor(s).dates.get(l.id);
  const fields = [{ k: 'title', l: 'Lesson', req: true, max: 80 }, { k: 'isdone', l: 'Finished', t: 'check' },
    { k: 'done', l: 'Done on', t: 'date', req: true, half: true, show: x => x.isdone }, { k: 'minutes', l: 'Minutes spent', t: 'int', min: 0, maxv: 1440, half: true, show: x => x.isdone },
    { k: 'got', l: 'Score (optional)', t: 'num', half: true, ph: 'e.g. 18', show: x => x.isdone }, { k: 'of', l: 'Out of', t: 'num', half: true, ph: 'e.g. 20', minv: 0.01, show: x => x.isdone },
    { k: 'note', l: 'Note (optional)', max: 200 }];
  openForm('Edit lesson', fields, { title: l.title, isdone: !!l.done, done: l.done || t, minutes: l.done ? l.minutes : s.minutes, got: l.got, of: l.of, note: l.note }, x => {
    const f = { title: x.title, note: x.note, done: '', minutes: 0, got: null, of: null };
    if (x.isdone) {
      if (x.done > t) { fieldErr('done', 'A lesson can’t be finished in the future.'); return false; }
      if ((x.got === null) !== (x.of === null)) { fieldErr(x.got === null ? 'got' : 'of', 'Fill in both the score and “out of”, or leave both empty.'); return false; }
      if (x.of !== null && x.of <= 0) { fieldErr('of', '“Out of” must be above 0.'); return false; }
      Object.assign(f, { done: x.done, minutes: x.minutes, got: x.got, of: x.of });
    }
    return commit(d => { const y = byId(d.lessons, l.id); if (!y) return 'This lesson no longer exists.'; Object.assign(y, f); }, { toast: 'Lesson saved' }) ? undefined : false;
  }, () => undoable('Lesson deleted', d => { d.lessons = d.lessons.filter(y => y.id !== l.id); }), { intro: subLabel(s) + ' · ' + studentOf(s.studentId).name + (l.done ? '' : pd ? ' · planned for ' + relDay(pd) : ''), delMsg: 'The lessons after it move up. You can undo right after.', focus: '#f_title' });
}
const CHEERS = ['Nice work', 'Well done', 'Great job', 'Onward', 'Another one done', 'Way to go'];
function markDone(id) {
  const l = byId(S.lessons, id); if (!l) return false; if (l.done) { toast('Already done ✓'); return false; }
  const s = subjectOf(l.subjectId); const m = studentOf(s.studentId); const t = today();
  return undoable(CHEERS[S.lessons.filter(x => x.done).length % CHEERS.length] + ', ' + m.name + '! ' + s.name + ': “' + l.title + '”', d => { const y = byId(d.lessons, id); if (!y) return 'This lesson no longer exists.'; y.done = t; y.minutes = s.minutes; });
}
function unDone(id) { const l = byId(S.lessons, id); if (!l || !l.done) return; undoable('Marked as not done' + (l.got !== null ? ' (its score was removed)' : ''), d => { const y = byId(d.lessons, id); if (!y) return 'Not found.'; y.done = ''; y.minutes = 0; y.got = null; y.of = null; }); }
function moveLesson(id, dir) {
  const l = byId(S.lessons, id); if (!l) return; const list = lessonsOf(l.subjectId); const i = list.findIndex(x => x.id === id); const j = i + dir; if (j < 0 || j >= list.length) return;
  const other = list[j]; commit(d => { const a = byId(d.lessons, l.id), b = byId(d.lessons, other.id); const o = a.order; a.order = b.order; b.order = o; });
  const btn = $('[data-act="' + (dir < 0 ? 'lup' : 'ldown') + '"][data-v="' + id + '"]'); if (btn && !btn.disabled) btn.focus();
}
function openExtra(stuId) {
  const m = studentOf(stuId); if (!m) return; const subs = S.subjects.filter(s => s.studentId === m.id && !s.archived).map(s => ({ s, l: lessonsOf(s.id).find(x => !x.done) })).filter(x => x.l);
  ask({ title: 'Extra lesson for ' + m.name, info: true, yes: 'Close', html: subs.length ? html`<p class="muted">Pick a subject — its next lesson is marked done today and the rest of the plan moves closer.</p><div class="pickgrid col">${subs.map(x => html`<button type="button" class="btn ghost pick" style="--mc:${sColor(m)}" data-act="extrapick" data-live="1" data-v="${x.l.id}"><span>${subLabel(x.s)}</span> <span class="tiny muted">· ${x.l.title}</span></button>`)}</div>` : html`<p>${m.name} has no lessons left to do.</p>` });
}
function dayOff(d) {
  if (!isDate(d)) return; if (inBreak(d)) { toast(dLong(d) + ' is already a day off.'); return; } if (!isSchoolDay(d)) { toast(dLong(d) + ' is not a school day.'); return; }
  undoable((d === today() ? 'Today' : dLong(d)) + ' is a day off — lessons moved to the next school day', x => { if (x.breaks.length >= LIMITS.breaks) return 'Break limit reached (' + LIMITS.breaks + '). Remove old breaks in Settings.'; x.breaks.push({ id: uid('b'), name: 'Day off', start: d, end: d }); });
}
function openBreak(id) {
  const b = id ? byId(S.breaks, id) : null; const t = today();
  openForm(b ? 'Edit break' : 'Add a break', [{ k: 'name', l: 'Name', req: true, max: 40, ph: 'e.g. Thanksgiving break' }, { k: 'start', l: 'First day off', t: 'date', req: true, half: true }, { k: 'end', l: 'Last day off', t: 'date', req: true, half: true }], b || { name: '', start: t, end: addDays(t, 4) }, v => {
    if (v.end < v.start) { fieldErr('end', 'The last day must be on or after the first day.'); return false; }
    if (dayDiff(v.start, v.end) > 400) { fieldErr('end', 'A break can be up to 400 days.'); return false; }
    return commit(d => { const f = { name: v.name, start: v.start, end: v.end }; if (b) { const x = byId(d.breaks, b.id); if (!x) return 'Not found.'; Object.assign(x, f); } else { if (d.breaks.length >= LIMITS.breaks) return 'Break limit reached.'; d.breaks.push(Object.assign({ id: uid('b') }, f)); } }, { toast: 'Break saved — lessons skip it' }) ? undefined : false;
  }, b ? () => undoable('Break removed', d => { d.breaks = d.breaks.filter(x => x.id !== b.id); }) : null, { delLabel: 'Remove', delMsg: 'Lessons will be planned on these days again. You can undo right after.' });
}

/* ---------- learning log ---------- */
function subjectNameOpts() { const seen = new Map(); for (const s of S.subjects) if (!seen.has(s.name.toLowerCase())) seen.set(s.name.toLowerCase(), s.name); return [['', 'Other learning (no subject)'], ...[...seen.values()].sort().map(n => [n, n])]; }
function openActivity(id, stuId) {
  if (!id && needStudent()) return;
  const a = id ? byId(S.activities, id) : null; const t = today();
  const fields = a ? [{ k: 'studentId', l: 'Student', t: 'select', req: true, opts: studentOpts() }] : [{ k: 'who', l: 'Who? (tick everyone who joined)', t: 'students', req: true }];
  fields.push({ k: 'title', l: 'What did you do?', req: true, max: 80, ph: 'e.g. Science museum field trip' }, { k: 'date', l: 'Date', t: 'date', req: true, half: true }, { k: 'minutes', l: 'Minutes (1–1440)', t: 'int', min: 1, maxv: 1440, half: true, hint: '90 = 1½ hours' }, { k: 'subj', l: 'Counts toward', t: 'select', opts: subjectNameOpts() });
  const sub = a ? subjectOf(a.subjectId) : null;
  openForm(a ? 'Edit learning log' : 'Log learning', fields, a ? { studentId: a.studentId, title: a.title, date: a.date, minutes: a.minutes, subj: sub ? sub.name : '' } : { who: stuId && studentOf(stuId) ? [stuId] : S.students.length === 1 ? [S.students[0].id] : [], title: '', date: t, minutes: 60, subj: '' }, v => {
    if (v.date > t) { fieldErr('date', 'Log learning that already happened (today or earlier).'); return false; }
    const subFor = sid => { if (!v.subj) return ''; const s = S.subjects.find(x => x.studentId === sid && x.name.toLowerCase() === v.subj.toLowerCase()); return s ? s.id : ''; };
    if (a) return commit(d => { const x = byId(d.activities, a.id); if (!x) return 'Not found.'; Object.assign(x, { studentId: v.studentId, title: v.title, date: v.date, minutes: v.minutes, subjectId: subFor(v.studentId) }); }, { toast: 'Saved' }) ? undefined : false;
    return undoable('Logged ' + fmtMin(v.minutes) + ' for ' + v.who.map(i => studentOf(i).name).join(' & '), d => { if (d.activities.length + v.who.length > LIMITS.activities) return 'Learning log is full.'; for (const sid of v.who) d.activities.push({ id: uid('a'), studentId: sid, subjectId: subFor(sid), date: v.date, title: v.title, minutes: v.minutes }); }) ? undefined : false;

let _lookKey = '';

/* ---------- recovery / repair screen ---------- */
function renderRecovery() {

    <div class="card"><h2>Step 2 · Choose what to do</h2>${!ok ? html`<p class="small muted">These unlock after Step 1.</p>` : ''}<div class="row" style="margin-top:10px">

    <label class="btn ghost ${ok ? '' : 'disabled'}" for="recFile" ${ok ? '' : raw('aria-disabled="true" style="opacity:.5;pointer-events:none"')}>Restore a backup</label><input type="file" id="recFile" accept=".json,application/json" hidden ${ok ? '' : raw('disabled')}>

/* ---------- tooltip & donut highlight ---------- */
function showTip(el, x, y) { const tip = $('#tip'); tip.textContent = el.getAttribute('data-tip'); tip.style.display = 'block'; const r = tip.getBoundingClientRect(); let lx = x - r.width / 2, ly = y - r.height - 12; lx = Math.max(6, Math.min(innerWidth - r.width - 6, lx)); if (ly < 6) ly = y + 16; tip.style.left = lx + 'px'; tip.style.top = ly + 'px'; }
function hideTip() { $('#tip').style.display = 'none'; }

  w.classList.add('hl'); $$('[data-seg]', w).forEach(x => x.classList.toggle('on', x.dataset.seg === i));
  $('.cl', w).textContent = el.dataset.l; $('.cv', w).textContent = el.dataset.val; $('.cp', w).textContent = el.dataset.pct + '% of total';
}
function donutReset(w) { if (!w) return; w.classList.remove('hl'); $$('[data-seg]', w).forEach(x => x.classList.remove('on')); $('.cl', w).textContent = w.dataset.cl; $('.cv', w).textContent = w.dataset.cv; $('.cp', w).textContent = ''; }

/* ---------- events (one delegated listener per type) ---------- */
function wire() {
  document.addEventListener('click', e => {
    const close = e.target.closest('[data-close]'); if (close) { e.preventDefault(); if (close.dataset.close === 'modal') requestClose(); else closeLayer('confirm'); return; }
    const nav = e.target.closest('[data-nav]'); if (nav && !e.target.closest('#modal,#confirm')) { e.preventDefault(); UI.view = nav.dataset.nav; render(); window.scrollTo(0, 0); const h = $('#view h1'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } return; }
    if (nav && e.target.closest('#confirm')) { e.preventDefault(); closeLayer('confirm'); UI.view = nav.dataset.nav; render(); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.closest('#modal,#confirm') && !a.dataset.live && a.dataset.act !== 'help') return;
    const fn = ACTIONS[a.dataset.act]; if (!fn) return;
    if (a.type !== 'checkbox') e.preventDefault();
    fn(a);
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'importFile') { const f = el.files[0]; el.value = ''; importFile(f); return; }
    if (el.dataset.set) { setSetting(el); return; }
    if (el.dataset.setday !== undefined) { const i = Number(el.dataset.setday); const cur = S.settings.schoolDays; const next = el.checked ? [...new Set([...cur, i])].sort() : cur.filter(x => x !== i); if (!next.length) { toast('Keep at least one school day.'); render(); return; } commit(d => { d.settings.schoolDays = next; }, { toast: 'School days saved — the plan is updated' }); return; }
    if (el.dataset.scale) { const k = el.dataset.scale; const n = Number(el.value); const sc = Object.assign({}, S.settings.scale, { [k]: n }); if (!Number.isInteger(n) || n < 0 || n > 100 || !(sc.a > sc.b && sc.b > sc.c && sc.c > sc.d) || sc.a < 1) { toast('Grade lines must go down from A to D (for example 90, 80, 70, 60).'); render(); return; } commit(d => { d.settings.scale = sc; }, { toast: 'Grade scale saved' }); return; }
    if (el.dataset.color) { const k = el.dataset.color; const val = el.value.toUpperCase(); commit(d => { const base = d.settings.palette === 'custom' ? d.settings.custom.base : d.settings.palette; const th = THEMES[base] || THEMES.sage; if (d.settings.palette !== 'custom') d.settings.custom = { base, accent: th.accent, accent2: th.accent2, gold: th.gold }; d.settings.custom[k] = val; d.settings.palette = 'custom'; }, { edit: false, toast: 'Custom colors saved' }); return; }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.color) { const th = currentTheme(); const o = { accent: th.accent, accent2: th.accent2, gold: th.gold }; o[el.dataset.color] = el.value.toUpperCase(); const v = themeVars(Object.assign({}, th, o)); const st = $('#palStyle'); if (st) { const block = x => Object.entries(x).map(([k, val]) => '--' + k + ':' + val + ';').join(''); st.textContent = ':root{' + block(v.L) + '}' + '@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){' + block(v.D) + '}}:root[data-theme="dark"]{' + block(v.D) + '}'; _lookKey = ''; } }
  });
  document.addEventListener('keydown', e => {
    const open = !$('#confirm').hidden ? $('#confirm') : !$('#modal').hidden ? $('#modal') : null;
    if (e.key === 'Escape' && open) { e.preventDefault(); if (open.id === 'confirm') { if (!(layers.confirm && layers.confirm.opts.welcome)) closeLayer('confirm'); } else requestClose(); return; }
    if (e.key === 'Tab' && open) { const f = $$('button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"],label[for]', open).filter(x => x.offsetParent !== null && !(x.tagName === 'INPUT' && (x.type === 'radio') && !x.checked && $$('input[name="' + x.name + '"]:checked', open).length)); if (!f.length) return; const i = f.indexOf(document.activeElement); if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && (i === f.length - 1 || i === -1)) { e.preventDefault(); f[0].focus(); } return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[tabindex][data-act]') && !open) { e.preventDefault(); e.target.click(); return; }
    if ((e.key === 'n' || e.key === 'N') && !e.ctrlKey && !e.metaKey && !e.altKey && !open && !UI.recovery && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && !e.target.isContentEditable) { e.preventDefault(); openActivity(); }
  });
  document.addEventListener('mousedown', e => { if (e.target.classList && e.target.classList.contains('layer')) { if (e.target.id === 'confirm') { if (!(layers.confirm && layers.confirm.opts.welcome)) closeLayer('confirm'); } else requestClose(); } });
  document.addEventListener('mouseover', e => { const s = e.target.closest && e.target.closest('.donutwrap [data-seg]'); if (s) donutHL(s); else { const w = e.target.closest && e.target.closest('.donutwrap'); if (!w) $$('.donutwrap.hl').forEach(donutReset); } });
  document.addEventListener('focusin', e => { const s = e.target.closest && e.target.closest('.donutwrap [data-seg]'); if (s) donutHL(s); else $$('.donutwrap.hl').forEach(donutReset); });
  document.addEventListener('mouseout', e => { const w = e.target.closest && e.target.closest('.donutwrap'); if (w && !w.contains(e.relatedTarget)) donutReset(w); });
  document.addEventListener('pointermove', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t && !e.target.closest('#modal,#confirm')) showTip(t, e.clientX, e.clientY); else hideTip(); });
  document.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t, e.clientX, e.clientY); } });
  window.addEventListener('scroll', hideTip, { passive: true });
  $('#fab').addEventListener('click', () => openActivity());
  setInterval(() => { if (!UI.recovery && today() !== lastRenderDay && !anyOpen()) render(); }, 60000);
}

/* ---------- boot (§6) ---------- */
function boot() {
  wire();
  let r = readRaw();
  if (!r.ok) { storageMode = 'memory'; S = sampleData(); applyLook(); render(); updSave(); welcome(true); return; }
  if (r.raw === null) { S = sampleData(); lastLen = JSON.stringify(S).length; applyLook(); render(); welcome(false); return; }
  let parsed; try { parsed = JSON.parse(r.raw); } catch (e) { parsed = undefined; }
  if (parsed === undefined) { S = blankData(); UI.recovery = { raw: r.raw, reason: 'The stored data is not readable — it may have been damaged.', fixes: [], data: null }; applyLook(); render(); return; }
  const s = sanitize(parsed);
  if (!s.data) { S = blankData(); UI.recovery = { raw: r.raw, reason: s.fixes[0], fixes: [], data: null }; applyLook(); render(); return; }
  if (s.fixes.length) { S = s.data; UI.recovery = { raw: r.raw, reason: '', fixes: s.fixes, data: s.data }; applyLook(); render(); return; }
  S = s.data; lastRaw = r.raw; lastLen = r.raw.length;
  // probe writability with a test key (never rewrite the data itself on boot)
  try { localStorage.setItem(LS_KEY + '.probe', '1'); localStorage.removeItem(LS_KEY + '.probe'); saveOk = true; } catch (e) { saveOk = false; saveMsg = errName(e); }
  applyLook(); render(); updSave();
}
function welcome(memoryOnly) {
  ask({ title: 'Welcome to Lesson Lantern', yes: 'Explore the example school', no: 'Start my own school',
    html: html`<p>Your homeschool planner and record keeper: lessons that roll forward when life happens, attendance that counts itself, hours, grades, report cards and a reading log. Everything stays in this browser on this computer — no account, no subscription.</p><p>Look around the Okafor family’s school first, or start your own right away.</p>${memoryOnly ? html`<div class="banner bad"><p>This browser is blocking storage for this file, so nothing will be kept after you close it. Try opening the file in Google Chrome.</p></div>` : ''}`,
    fn: () => { if (!memoryOnly) { if (save()) toast('Exploring the Okafors’ school. Start your own whenever you are ready.'); } render(); },
    after: el => { const no = $('.actions .ghost', el); no.removeAttribute('data-close'); no.onclick = () => { closeLayer('confirm'); const d = blankData(); S = d; if (!memoryOnly) save(); UI.view = 'today'; render(); toast('Your school is ready. Add your first student.'); }; }
  });
  layers.confirm.opts.welcome = true;
}
function setSetting(el) {
  const k = el.dataset.set; let v = el.value; const st = S.settings;
  if (k === 'weekStart') { v = Number(v); UI.week = null; }
  if (k === 'school') v = v.trim().slice(0, 50);
  if (k === 'yearStart' || k === 'yearEnd') { const s0 = k === 'yearStart' ? v : st.yearStart, e0 = k === 'yearEnd' ? v : st.yearEnd; if (!isDate(v)) { toast('Please pick a real date.'); render(); return; } if (e0 <= s0) { toast('The last day must be after the first day.'); render(); return; } if (dayDiff(s0, e0) > 731) { toast('A school year can be up to 2 years long.'); render(); return; } }
  if (k === 'targetDays' || k === 'targetHours') { const n = Number(v); const max = k === 'targetDays' ? 366 : 5000; if (v === '' || !Number.isInteger(n) || n < 0 || n > max) { toast('Please enter a whole number from 0 to ' + max + '.'); render(); return; } v = n; }
  if (k === 'theme' && !['auto', 'light', 'dark'].includes(v)) return;
  const appearance = ['theme', 'weekStart'].includes(k);
  commit(d => { d.settings[k] = v; }, { edit: !appearance, toast: appearance ? null : 'Saved' }); if (k === 'theme') applyLook();
}
document.addEventListener('DOMContentLoaded', boot);
