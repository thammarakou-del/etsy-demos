<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="color-scheme" content="light dark">
<title>Tulle Plan — Free Demo</title>
<style>
:root{
  --sans: ui-rounded,"SF Pro Rounded","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,"Noto Sans Thai",sans-serif;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --bg:#F4F3EE;--card:#FFFFFF;--soft:#ECEFE8;--line:#E2E5DD;--ink:#1F2A26;--muted:#5E6A63;--accent:#4F7C67;--accent-2:#E58A6B;--gold:#E1B04B;--good:#3E8A62;--bad:#C4553F;
  --on-accent:#FFFFFF;--on-accent-2:#1F2A26;--focus-bg:#1F2A26;--focus-ink:#F4F3EE;--accent-ink:#4F7C67;--accent2-ink:#B4553A;--good-ink:#3E8A62;--gold-ink:#8A6A1F;
  --shadow:0 1px 2px rgba(31,42,38,.04),0 12px 32px rgba(31,42,38,.06);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:500;letter-spacing:-.015em;margin:0}
h1{font-size:40px;line-height:1.1}
h2{font-size:22px;line-height:1.2}
h3{font-size:18px}
p{margin:0 0 .6em}
a{color:var(--accent-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:var(--muted);margin-bottom:6px}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;z-index:200;background:var(--card);padding:8px 14px;border-radius:999px}
.skip:focus{left:8px}

/* layout */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 14px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line);background:var(--bg)}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand b{font-family:var(--serif);font-weight:500;font-size:21px;display:block;line-height:1.1}
.brand span{font-size:11.5px;line-height:1.3;color:var(--muted);font-style:italic;font-family:var(--serif);display:block}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
.nav a:hover{background:var(--soft)}
.nav a[aria-current=page]{background:var(--card);box-shadow:var(--shadow);color:var(--accent-ink)}
.nav svg,.ico{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
.main{min-width:0;padding:0 40px 90px;max-width:1220px;width:100%;justify-self:center}
.topbar{display:flex;align-items:center;gap:10px;padding:18px 0 10px;flex-wrap:wrap}
.topbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;flex:none}
.chip.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card));border-color:var(--bad);color:var(--ink)}
.chip.bad .dot{background:var(--bad)}
.view{min-width:0}
.view section{margin-bottom:22px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:14px 0 22px}
.head .lead{color:var(--muted);margin-top:6px;max-width:640px}
.foot{color:var(--muted);font-size:12.5px;margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}

/* cards & grids */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);min-width:0;position:relative}
.card-t{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card-t h2,.card-t h3{font-size:20px}
.card-t .sp{flex:1}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px}
.kpi .k{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--muted)}
.kpi .v{font-family:var(--serif);font-size:30px;line-height:1.15;margin:6px 0 2px;overflow-wrap:anywhere}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.good .v{color:var(--good-ink)} .kpi.gold .v{color:var(--gold-ink)} .kpi.warm .v{color:var(--accent2-ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;font-weight:700;font-size:14px;padding:10px 18px;border:1px solid transparent;cursor:pointer;background:var(--soft);color:var(--ink);min-height:40px;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px;min-height:32px}
.btn.link{background:none;padding:0;min-height:0;border:0;text-decoration:underline;color:var(--accent-ink);font-weight:600}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.help{width:21px;height:21px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--muted);font-size:12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.tag.good{background:color-mix(in srgb,var(--good) 16%,var(--card));color:var(--good-ink)}
.tag.bad{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--ink)}
.tag.warm{background:color-mix(in srgb,var(--accent-2) 20%,var(--card));color:var(--ink)}
.tag.gold{background:color-mix(in srgb,var(--gold) 25%,var(--card));color:var(--ink)}
.banner{border-radius:18px;padding:14px 18px;margin:8px 0 16px;background:color-mix(in srgb,var(--gold) 18%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card));border-color:var(--bad)}
.banner.info{background:color-mix(in srgb,var(--accent) 10%,var(--card));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.banner p{margin:0;flex:1;min-width:220px}

/* hero */
.hero{overflow:hidden;background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%),radial-gradient(70% 60% at 100% 0%,color-mix(in srgb,var(--accent-2) 12%,transparent),transparent 70%),var(--card)}
.big{font-family:var(--serif);font-size:clamp(66px,9vw,112px);line-height:1;letter-spacing:-.03em;margin:8px 0 6px;display:flex;align-items:baseline;flex-wrap:wrap}
.big .sym{font-size:.4em;margin:0 .08em;color:var(--muted)}
.big .frac{font-size:.42em;color:var(--accent-ink)}
.hero .sub{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--muted);margin-bottom:14px}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.over>i{background:color-mix(in srgb,var(--bad) 65%,var(--gold))}
.bar.gold>i{background:var(--gold)} .bar.good>i{background:var(--good)} .bar.warm>i{background:var(--accent-2)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.qbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:40px}
.qbtn:hover{background:var(--soft)}
.divider{border-top:1.5px dashed var(--line);margin:14px 0}

/* focus card */
.focus{background:var(--focus-bg);color:var(--focus-ink);border-radius:24px;padding:22px;display:flex;gap:16px;align-items:flex-start;margin-bottom:18px;box-shadow:var(--shadow)}
.focus .em{width:46px;height:46px;border-radius:50%;background:color-mix(in srgb,var(--focus-ink) 14%,transparent);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.focus .eyebrow{color:color-mix(in srgb,var(--focus-ink) 70%,transparent)}
.focus .txt{font-family:var(--serif);font-size:25px;line-height:1.2}
.focus .sub{opacity:.82;margin:6px 0 12px}
.focus .btn.ghost{color:var(--focus-ink);border-color:color-mix(in srgb,var(--focus-ink) 35%,transparent)}
.focus .btn.soft{background:color-mix(in srgb,var(--focus-ink) 14%,transparent);color:var(--focus-ink)}

/* lists */
.list{list-style:none;margin:0;padding:0}
.li{display:flex;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line);border-radius:12px;min-width:0}
.li:last-child{border-bottom:0}
.li[data-act]{cursor:pointer}
.li[data-act]:hover{background:var(--soft)}
.tile{width:38px;height:38px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.li .mid{flex:1;min-width:0}
.li .t{font-weight:700;overflow-wrap:anywhere}
.li .k{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.amt{font-family:var(--serif);font-size:18px;white-space:nowrap}
.amt.in{color:var(--good-ink)}
.empty{color:var(--muted);padding:12px 4px}
.empty .btn{margin-top:8px}
.wrapr{flex-wrap:wrap}
.coming{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ctile{background:var(--soft);border-radius:16px;padding:12px}
.ctile .d{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ctile .n{font-weight:700;margin:2px 0;overflow-wrap:anywhere}
.ctile .a{font-family:var(--serif);font-size:19px}
.ctile.inc .a{color:var(--good-ink)}
.wins .li{border:0;padding:6px 0}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;color:transparent}
.tick.on{background:var(--good);border-color:var(--good);color:#fff;animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.cheer{font-family:var(--serif);font-style:italic;color:var(--accent-ink);margin:8px 0}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--soft);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}
.dump input[type=text]{width:100%}
.note{display:flex;gap:10px;align-items:center;padding:6px 0}
.note.done span{text-decoration:line-through;color:var(--muted)}
.note span{flex:1;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;width:32px;height:32px;border-radius:50%}
.x:hover{background:var(--soft)}

/* forms */
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-height:44px;padding:9px 13px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=color]{width:52px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:2px}
textarea{resize:vertical;min-height:110px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.field>.lbl{font-weight:700;font-size:14px}
.field .hint{font-size:12.5px;color:var(--muted)}
.field .prev{font-size:12.5px;color:var(--accent-ink);font-weight:700;min-height:1em}
.field .ferr{font-size:13px;color:var(--bad);font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--card);box-shadow:var(--shadow);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.catpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.catpick label{border:1px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center;cursor:pointer;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;overflow-wrap:anywhere}
.catpick label span{font-size:20px}
.catpick input{position:absolute;opacity:0;pointer-events:none}
.catpick label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.catpick label:has(input:focus-visible){outline:2px solid var(--accent)}
.bigamt{display:flex;align-items:center;justify-content:center;gap:4px;border-radius:20px;background:var(--soft);padding:10px}
.bigamt span{font-family:var(--serif);font-size:30px;color:var(--muted)}
.bigamt input{font-family:var(--serif);font-size:58px;text-align:center;border:0;background:transparent;min-height:0;padding:0;width:100%;max-width:340px}
.bigamt input:focus{outline:none}
.bigamt:focus-within{outline:2px solid var(--accent)}
.chips{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.emojirow{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.emojirow button{border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:18px;width:36px;height:36px;cursor:pointer;padding:0}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* modal layers */
.layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(17,21,19,.42)}
#modal{z-index:50} #confirm{z-index:70}
.sheet{background:var(--card);color:var(--ink);border-radius:26px;padding:24px;width:100%;max-width:560px;max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);position:relative}
.sheet.wide{max-width:760px}
.sheet h2{margin-bottom:14px;padding-right:30px}
.sheet .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.sheet .actions .sp{flex:1}
.how{width:100%;border-collapse:collapse}
.how td{padding:6px 4px;border-bottom:1px solid var(--line)}
.how td:last-child{text-align:right;font-family:var(--serif);white-space:nowrap}
.how tr.tot td{font-weight:800;border-top:2px solid var(--ink)}

/* toast & tooltip */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:95;pointer-events:none;display:flex;justify-content:center;width:max-content;max-width:calc(100vw - 32px)}
#toast .t{background:var(--ink);color:var(--bg);border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.2)}
#toast button{pointer-events:auto;background:none;border:1px solid color-mix(in srgb,var(--bg) 50%,transparent);color:var(--bg);border-radius:999px;padding:4px 12px;font-weight:800;cursor:pointer}
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:700;border-radius:10px;padding:6px 10px;white-space:nowrap;display:none}

/* month rail */
.rail{position:sticky;top:0;height:100vh;padding:16px 0 16px 6px;display:flex;flex-direction:column;gap:6px}
.ry{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:4px}
.ry button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;width:24px;height:30px;padding:0}
.ry .yl{font-family:var(--serif);font-size:18px;color:var(--ink);width:auto;padding:0 2px}
.ry .yl.on{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px;text-decoration-thickness:2px}
.tabs{display:flex;flex-direction:column;gap:4px;flex:1}
.mt{flex:1;min-height:30px;max-height:62px;margin-left:16px;border-radius:16px 0 0 16px;border:0;cursor:pointer;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;position:relative;transition:margin .2s}
.mt:hover{margin-left:8px}
.mt.on{margin-left:0;box-shadow:-6px 4px 18px rgba(0,0,0,.14);color:#18201D !important}
.mt.now::before{content:"";position:absolute;left:7px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--accent)}
.mt.has::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.7}
.mstrip{display:none;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:8px;scrollbar-width:thin}
.mstrip button{flex:none;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:7px 12px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--ink)}
.mstrip button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.mstrip button.now{border-color:var(--accent);border-width:2px}
.fab{display:none}

/* calendar */
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;padding:4px 0}
.day{min-height:104px;border-radius:14px;border:1px solid var(--line);padding:6px 7px;cursor:pointer;background:color-mix(in srgb,var(--accent-2) var(--h,0%),var(--card));display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden;text-align:left;color:var(--ink)}
.day.blank{border-style:dashed;opacity:.45;cursor:default;background:transparent}
.day.today{border:2px solid var(--accent)}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.day .n{font-weight:800;font-size:14px;display:flex;justify-content:space-between;gap:4px}
.day .sp{font-size:11.5px;color:var(--muted);font-weight:700}
.ev{font-size:11px;font-weight:700;border-radius:6px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.pay{background:color-mix(in srgb,var(--good) 22%,var(--card))}
.ev.bill{background:color-mix(in srgb,var(--accent-2) 26%,var(--card))}
.ev.paid{background:var(--soft);text-decoration:line-through;color:var(--muted)}
.ev.goal{background:color-mix(in srgb,var(--gold) 30%,var(--card))}
.evdots{display:none}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.chart .grid{stroke:var(--line)}
.chart g.col{cursor:default}
.chart g.col[data-act]{cursor:pointer}
.chart:hover g.col{opacity:.5}
.chart:hover g.col:hover{opacity:1}
.chart .hit{fill:transparent}
.chart .hl{stroke:var(--ink);stroke-width:1.5}
.anim .chart rect.b{animation:grow .65s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.anim .donut g.segs{animation:spin .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:95px 95px}
@keyframes spin{from{transform:rotate(-70deg) scale(.86);opacity:0}to{transform:none;opacity:1}}
.legendc{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:6px}
.legendc i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- SEATING ---------- */
function tableSVG(t, used) {
  const n = t.seats, R = 34, cx = 50, cy = 50; const dots = [];
  for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / n; dots.push(html`<circle cx="${(cx + 44 * Math.cos(a)).toFixed(1)}" cy="${(cy + 44 * Math.sin(a)).toFixed(1)}" r="${n > 16 ? 3.5 : 5}" class="${i < used ? 'su' : 'se'}"/>`); }
  return html`<svg class="tsvg" viewBox="0 0 100 100" role="img" aria-label="${t.name + ': ' + used + ' of ' + n + ' seats taken'}"><circle cx="${cx}" cy="${cy}" r="${R}" class="tb ${used > n ? 'over' : ''}"/>${dots}<text x="50" y="47" text-anchor="middle" class="tn">${used}/${n}</text><text x="50" y="61" text-anchor="middle" class="ts">seats</text></svg>`;
}
function vSeating() {

  const seats = sum(S.tables, t => t.seats); const seated = S.guests.filter(g => g.tableId && g.rsvp !== 'no').length; const over = S.tables.filter(t => tableUse(t.id) > t.seats); const split = splitGroups();
  const declinedSeated = S.guests.filter(g => g.tableId && g.rsvp === 'no');
  const opts = S.tables.map(t => [t.id, t.name + ' (' + tableUse(t.id) + '/' + t.seats + ')']);
  return html`<div class="head"><div><div class="eyebrow">Seating</div><h1>Seating chart</h1><p class="lead">Pick a table for each guest, drag names onto tables, or let Auto-seat fill tables while keeping households together.</p></div><div class="row noprint"><button class="btn primary" type="button" data-act="newtable">+ Add a table</button><button class="btn ghost" type="button" data-act="autoseat" ${!S.tables.length || !need.length ? raw('disabled') : ''}>✨ Auto-seat</button><button class="btn ghost" type="button" data-act="printseat" data-v="chart">Print chart</button><button class="btn ghost" type="button" data-act="printseat" data-v="escort">Print name → table list</button>${helpBtn('seating')}</div></div>
  <div class="g4" style="margin-bottom:14px">${kpi('Tables', String(S.tables.length), plural(seats, 'seat') + ' in total')}${kpi('Seated', String(seated), 'guests with a table', 'good')}${kpi('Need a seat', String(S.guests.filter(g => needsSeat(g, false)).length), 'attending, no table yet', 'gold')}${kpi('Free seats', String(Math.max(0, seats - seated)), over.length ? plural(over.length, 'table') + ' over capacity' : 'no table over capacity', over.length ? 'warm' : '')}</div>
  ${over.length || split.length || declinedSeated.length ? html`<div class="banner" role="status"><p>${over.length ? html`<b>Too many at:</b> ${over.map(t => t.name + ' (' + tableUse(t.id) + '/' + t.seats + ')').join(', ')}. ` : ''}${split.length ? html`<b>Split households:</b> ${split.join(', ')}. ` : ''}${declinedSeated.length ? html`<b>${plural(declinedSeated.length, 'declined guest')}</b> still ${declinedSeated.length === 1 ? 'has' : 'have'} a table: ${declinedSeated.map(g => g.name).join(', ')}.` : ''}</p>${declinedSeated.length ? html`<button class="btn sm" type="button" data-act="cleardeclined">Free those seats</button>` : ''}</div>` : ''}
  <div class="seatgrid"><div class="card needcard" data-drop=""><div class="card-t"><h2>Need a seat</h2><span class="sp"></span><span class="small muted">${need.length}</span></div><label class="check small" style="margin-bottom:8px"><input type="checkbox" id="seatPending" ${pend ? raw('checked') : ''}> Include guests who haven’t replied</label>
    ${need.length ? html`<ul class="list">${need.map(g => html`<li class="li seatli" draggable="true" data-gid="${g.id}"><span class="drag" aria-hidden="true">⋮⋮</span><div class="mid"><div class="t">${g.name}</div><div class="k">${g.group || 'No household'}${g.rsvp === 'invited' ? ' · waiting' : ''}</div></div>${S.tables.length ? html`<label class="sr" for="${'s_' + g.id}">Table for ${g.name}</label><select id="${'s_' + g.id}" class="mini" data-seat="${g.id}"><option value="">Table…</option>${opts.map(o => html`<option value="${o[0]}">${o[1]}</option>`)}</select>` : ''}</li>`)}</ul>` : html`<p class="empty">${S.guests.some(g => g.rsvp === 'yes') ? 'Everyone attending has a seat. 🎉' : 'Guests who say yes appear here.'}</p>`}</div>
  <div>${S.tables.length ? html`<div class="tgrid">${S.tables.map(t => { const gl = S.guests.filter(g => g.tableId === t.id); const used = gl.filter(g => g.rsvp !== 'no').length; return html`<div class="card tcard ${used > t.seats ? 'over' : ''}" data-drop="${t.id}" data-table="${t.id}"><div class="card-t"><button class="btn link tname" type="button" data-act="edittable" data-v="${t.id}">${t.name}</button><span class="sp"></span><span class="tag ${used > t.seats ? 'warm' : used === t.seats ? 'good' : ''}">${used}/${t.seats}</span></div>${tableSVG(t, used)}<ul class="tlist">${gl.map(g => html`<li draggable="true" data-gid="${g.id}" class="${g.rsvp === 'no' ? 'struck' : ''}"><span>${g.name}</span><button class="x" type="button" data-act="unseat" data-v="${g.id}" aria-label="${'Remove ' + g.name + ' from ' + t.name}">×</button></li>`)}</ul></div>`; })}</div>` : html`<div class="card">${emptyState('Add your tables first — name them and choose how many seats each has.', '+ Add a table', 'newtable')}<button class="btn ghost sm" type="button" data-act="quicktables">Add 10 round tables of 8</button></div>`}</div></div>
  <div class="print-only pchart"><h2>${coupleName() || 'Wedding'} — seating chart</h2><div class="pgrid">${S.tables.map(t => html`<div class="ptable"><h3>${t.name}</h3><ol>${S.guests.filter(g => g.tableId === t.id && g.rsvp !== 'no').map(g => html`<li>${g.name}</li>`)}</ol></div>`)}</div></div>
  <div class="print-only pescort"><h2>Find your seat</h2><div class="ecols">${S.guests.filter(g => g.tableId && g.rsvp !== 'no').sort((a, b) => a.name.localeCompare(b.name)).map(g => html`<div class="erow"><span>${g.name}</span><b>${(byId(S.tables, g.tableId) || { name: '' }).name}</b></div>`)}</div></div>`;
}

function openPay(itemId, payId) {

function importFile(file) {

    if (typeof obj.schema === 'number' && obj.schema > SCHEMA) { no('This backup was made by a newer version of Tulle Plan, so nothing was changed.'); return; }
    for (const [k, lim] of Object.entries(LIMITS)) if (Array.isArray(obj[k]) && obj[k].length > lim) { no('This backup has more ' + k + ' than Tulle Plan can hold (' + lim + '), so nothing was changed.'); return; }

    ask({ title: 'Restore this backup?', yes: 'Replace my data', danger: true, html: html`<p data-testid="restore-msg">“${file.name}” has ${plural(d.guests.length, 'guest')}, ${plural(d.items.length, 'vendor')} and ${plural(d.tasks.length, 'task')}. Everything currently here will be replaced.</p>${fixList}`, fn: () => restoreData(d, 'Backup restored') });

  setHTML($('#view'), html`<div class="recov"><div class="eyebrow">Your saved data</div><h1>${r.data ? 'Your data needs a small repair' : 'Your saved data could not be opened'}</h1>

    <div class="card" style="margin:16px 0"><h2>Step 1 · Save a copy of exactly what is stored</h2><p class="muted">Keep this file. It may help recover entries later.</p><button class="btn primary" type="button" id="recRaw">Download the stored data (${Math.ceil(r.raw.length / 1024)} KB)</button>${ok ? html` <span class="tag good">Saved ✓</span>` : ''}</div>
    <div class="card"><h2>Step 2 · Choose what to do</h2>${!ok ? html`<p class="small muted">These unlock after Step 1.</p>` : ''}<div class="row" style="margin-top:10px">

  $('#recRaw').onclick = () => { download('TullePlan-stored-data-' + today() + '.txt', r.raw, 'text/plain'); UI.rawExported = true; renderRecovery(); };

/* ---------- tooltip & donut highlight ---------- */
function showTip(el, x, y) { const tip = $('#tip'); tip.textContent = el.getAttribute('data-tip'); tip.style.display = 'block'; const r = tip.getBoundingClientRect(); let lx = x - r.width / 2, ly = y - r.height - 12; lx = Math.max(6, Math.min(innerWidth - r.width - 6, lx)); if (ly < 6) ly = y + 16; tip.style.left = lx + 'px'; tip.style.top = ly + 'px'; }
function hideTip() { $('#tip').style.display = 'none'; }
function donutHL(el) {
  const w = el.closest('.donutwrap'); if (!w) return; const i = el.dataset.seg;
  w.classList.add('hl'); $$('[data-seg]', w).forEach(x => x.classList.toggle('on', x.dataset.seg === i));
  $('.cl', w).textContent = el.dataset.l; $('.cv', w).textContent = el.dataset.val; $('.cp', w).textContent = el.dataset.pct + '% of total';
}
function donutReset(w) { if (!w) return; w.classList.remove('hl'); $$('[data-seg]', w).forEach(x => x.classList.remove('on')); $('.cl', w).textContent = w.dataset.cl; $('.cv', w).textContent = w.dataset.cv; $('.cp', w).textContent = ''; }

/* ---------- events (one delegated listener per type) ---------- */
function wire() {
  document.addEventListener('click', e => {
    const close = e.target.closest('[data-close]'); if (close) { e.preventDefault(); if (close.dataset.close === 'modal') requestClose(); else closeLayer('confirm'); return; }
    const nav = e.target.closest('[data-nav]'); if (nav && !e.target.closest('#modal,#confirm')) { e.preventDefault(); goView(nav.dataset.nav); return; }
    if (nav && e.target.closest('#confirm')) { e.preventDefault(); closeLayer('confirm'); UI.view = nav.dataset.nav; render(); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.closest('#modal,#confirm') && !a.dataset.live && a.dataset.act !== 'help') return;
    const fn = ACTIONS[a.dataset.act]; if (!fn) return;
    if (a.type !== 'checkbox') e.preventDefault();
    fn(a);
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.closest('#modal,#confirm')) return;
    if (el.id === 'importFile') { const f = el.files[0]; el.value = ''; importFile(f); return; }
    if (el.dataset.set) {
      const k = el.dataset.set; let v = el.value;
      if (k === 'meals') { if (!setMeals(v)) el.value = S.settings.meals.join(', '); return; }
      if ((k === 'date' || k === 'rsvpBy') && v && !isDate(v)) { toast('Please choose a real date.'); el.value = S.settings[k]; return; }
      if (k === 'time' && !isTime(v)) { toast('Please choose a time.'); el.value = S.settings.time; return; }
      if (k === 'p1' || k === 'p2' || k === 'venue') v = v.trim();
      const appearance = ['theme', 'currency', 'locale'].includes(k);
      commit(d => { d.settings[k] = v; }, { edit: !appearance, toast: appearance ? null : 'Saved' }); if (k === 'theme') applyLook(); return;
    }
    if (el.dataset.setmoney) { const r = el.value.trim() ? parseMoney(el.value, { zero: true }) : { ok: true, cents: 0 }; if (!r.ok) { toast(r.error); el.value = S.settings.budget ? toInput(S.settings.budget) : ''; return; } commit(d => { d.settings.budget = r.cents; }, { toast: 'Total budget saved' }); return; }
    if (el.dataset.gset) { setGuestField(el.dataset.v, el.dataset.gset, el.value); return; }
    if (el.dataset.seat !== undefined && el.dataset.seat) { if (el.value) seatGuest(el.dataset.seat, el.value); return; }
    if (el.id === 'seatPending') { UI.seatPending = el.checked; render(); return; }
    if (el.dataset.tfilter) { UI.taskFilter = el.value; renderTaskList(); return; }
    if (el.id === 'gRsvp') { UI.gRsvp = el.value; renderGuestTable(); return; }
    if (el.id === 'gSide') { UI.gSide = el.value; renderGuestTable(); return; }
    if (el.dataset.color) { const k = el.dataset.color; const val = el.value.toUpperCase(); commit(d => { const base = d.settings.palette === 'custom' ? d.settings.custom.base : d.settings.palette; const th = THEMES[base] || THEMES.peach; if (d.settings.palette !== 'custom') d.settings.custom = { base, accent: th.accent, accent2: th.accent2, gold: th.gold }; d.settings.custom[k] = val; d.settings.palette = 'custom'; }, { edit: false, toast: 'Custom colors saved' }); return; }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'tSearch') { UI.taskSearch = el.value; renderTaskList(); return; }
    if (el.id === 'gSearch') { UI.gSearch = el.value; renderGuestTable(); return; }
    if (el.dataset.color) { const th = currentTheme(); const o = { accent: th.accent, accent2: th.accent2, gold: th.gold }; o[el.dataset.color] = el.value.toUpperCase(); const v = themeVars(Object.assign({}, th, o)); const st = $('#palStyle'); if (st) { const block = x => Object.entries(x).map(([k, val]) => '--' + k + ':' + val + ';').join(''); st.textContent = ':root{' + block(v.L) + '}' + '@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){' + block(v.D) + '}}:root[data-theme="dark"]{' + block(v.D) + '}'; _lookKey = ''; } }
  });
  document.addEventListener('keydown', e => {
    const open = !$('#confirm').hidden ? $('#confirm') : !$('#modal').hidden ? $('#modal') : null;
    if (e.key === 'Escape' && open) { e.preventDefault(); if (open.id === 'confirm') { if (!(layers.confirm && layers.confirm.opts.welcome)) closeLayer('confirm'); } else requestClose(); return; }
    if (e.key === 'Tab' && open) { const f = $$('button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"],label[for]', open).filter(x => x.offsetParent !== null && !(x.tagName === 'INPUT' && (x.type === 'radio') && !x.checked && $$('input[name="' + x.name + '"]:checked', open).length)); if (!f.length) return; const i = f.indexOf(document.activeElement); if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && (i === f.length - 1 || i === -1)) { e.preventDefault(); f[0].focus(); } return; }
    if (e.target.id === 'dumpIn' && e.key === 'Enter') { e.preventDefault(); const v = e.target.value.trim(); if (!v) return; if (commit(d => { if (d.notes.length >= LIMITS.notes) return 'Brain dump is full. Clear some done notes.'; d.notes.unshift({ id: uid('n'), text: v.slice(0, 200), done: false }); })) { const i = $('#dumpIn'); if (i) i.focus(); } return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[tabindex][data-act]') && !open) { e.preventDefault(); e.target.click(); return; }
    if ((e.key === 'n' || e.key === 'N') && !e.ctrlKey && !e.metaKey && !e.altKey && !open && !UI.recovery && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && !e.target.isContentEditable) { e.preventDefault(); ACTIONS[addBtn()[1]]({ dataset: {} }); }
  });
  document.addEventListener('mousedown', e => { if (e.target.classList && e.target.classList.contains('layer')) { if (e.target.id === 'confirm') { if (!(layers.confirm && layers.confirm.opts.welcome)) closeLayer('confirm'); } else requestClose(); } });
  document.addEventListener('mouseover', e => { const s = e.target.closest && e.target.closest('.donutwrap [data-seg]'); if (s) donutHL(s); else { const w = e.target.closest && e.target.closest('.donutwrap'); if (!w) $$('.donutwrap.hl').forEach(donutReset); } });
  document.addEventListener('focusin', e => { const s = e.target.closest && e.target.closest('.donutwrap [data-seg]'); if (s) donutHL(s); else $$('.donutwrap.hl').forEach(donutReset); });
  document.addEventListener('mouseout', e => { const w = e.target.closest && e.target.closest('.donutwrap'); if (w && !w.contains(e.relatedTarget)) donutReset(w); });
  document.addEventListener('pointermove', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t && !e.target.closest('#modal,#confirm')) showTip(t, e.clientX, e.clientY); else hideTip(); });
  document.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t, e.clientX, e.clientY); } });
  window.addEventListener('scroll', hideTip, { passive: true });
  $('#fab').addEventListener('click', () => ACTIONS[addBtn()[1]]({ dataset: {} }));
  // drag & drop seating (mouse); the table menus do the same with the keyboard
  document.addEventListener('dragstart', e => { const li = e.target.closest && e.target.closest('[data-gid]'); if (!li) return; e.dataTransfer.setData('text/plain', li.dataset.gid); e.dataTransfer.effectAllowed = 'move'; });
  document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('dropping'); } });
  document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('dropping'); });
  document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); z.classList.remove('dropping'); const gid = e.dataTransfer.getData('text/plain'); if (gid && byId(S.guests, gid)) seatGuest(gid, z.dataset.drop); });
  setInterval(() => { if (!UI.recovery && today() !== lastRenderDay && !anyOpen()) render(); }, 60000);
}

/* ---------- boot (§6) ---------- */
function boot() {
  wire();
  let r = readRaw();
  if (!r.ok) { storageMode = 'memory'; S = sampleData(); applyLook(); render(); updSave(); welcome(true); return; }
  if (r.raw === null) { S = sampleData(); lastLen = JSON.stringify(S).length; applyLook(); render(); welcome(false); return; }
  let parsed; try { parsed = JSON.parse(r.raw); } catch (e) { parsed = undefined; }
  if (parsed === undefined) { S = blankData(); UI.recovery = { raw: r.raw, reason: 'The stored data is not readable — it may have been damaged.', fixes: [], data: null }; applyLook(); render(); return; }
  const s = sanitize(parsed);
  if (!s.data) { S = blankData(); UI.recovery = { raw: r.raw, reason: s.fixes[0], fixes: [], data: null }; applyLook(); render(); return; }
  if (s.fixes.length) { S = s.data; UI.recovery = { raw: r.raw, reason: '', fixes: s.fixes, data: s.data }; applyLook(); render(); return; }
  S = s.data; lastRaw = r.raw; lastLen = r.raw.length;
  // probe writability with a test key (never rewrite the data itself on boot)
  try { localStorage.setItem(LS_KEY + '.probe', '1'); localStorage.removeItem(LS_KEY + '.probe'); saveOk = true; } catch (e) { saveOk = false; saveMsg = errName(e); }
  applyLook(); render(); updSave();
}

    fn: () => { if (!memoryOnly) { if (save()) toast('Exploring Mia & Theo’s wedding. Start your own whenever you are ready.'); } render(); },
    after: el => { const no = $('.actions .ghost', el); no.removeAttribute('data-close'); no.onclick = () => { closeLayer('confirm'); S = blankData(); if (!memoryOnly) save(); UI.view = 'home'; render(); toast('Your own plan is ready.'); openSetup(); }; }
  });
  layers.confirm.opts.welcome = true;
}
document.addEventListener('DOMContentLoaded', boot);
